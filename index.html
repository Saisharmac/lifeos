function taskDueState(t){if(t.done)return 'completed';if(!t.due)return 'unscheduled';if(t.due<today())return 'overdue';if(t.due===today())return 'today';if(t.due<=addDays(today(),7))return 'upcoming';return 'later'}
function taskCard(t){const state=taskDueState(t),checks=t.checklist||[],doneChecks=checks.filter(c=>c.done).length,priority=t.priority||'normal';return `<article class="task-card ${t.done?'task-completed':''} ${state==='overdue'?'task-overdue':''}"><button type="button" class="task-complete" data-action="toggleTask" data-id="${esc(t.id)}" aria-label="${t.done?'Reopen':'Complete'} ${esc(t.title)}" aria-pressed="${t.done?'true':'false'}">${t.done?'✓':''}</button><div class="task-main"><button type="button" class="task-title-button" data-action="editTask" data-id="${esc(t.id)}">${esc(t.title)}</button><div class="task-meta">${t.due?`<span class="due-pill ${state==='overdue'?'due-overdue':state==='today'?'due-today':''}">${state==='overdue'?'Overdue · ':state==='today'?'Due today · ':''}${esc(fmtDate(t.due))}</span>`:`<span class="due-pill">No due date</span>`}${priority==='high'?chip('High priority','bad'):priority==='low'?chip('Low priority'):''}${t.category?chip(t.category):''}${t.projectId?chip(projectName(t.projectId)):''}${checks.length?chip(`${doneChecks}/${checks.length} steps`):''}</div>${t.notes?`<div class="task-note">${esc(t.notes)}</div>`:''}</div><div class="task-actions"><button type="button" class="task-play" data-action="taskTimer" data-id="${esc(t.id)}" aria-label="Track time for ${esc(t.title)}" title="Start tracking">▶</button>${recordMenu('task',t.id,'Task options')}</div></article>`}
function tasksPage(v){const all=db.tasks,open=all.filter(t=>!t.done),overdue=open.filter(t=>t.due&&t.due<today()),dueToday=open.filter(t=>t.due===today()),completed=all.filter(t=>t.done),weekEnd=addDays(today(),7);let list=all.filter(t=>{const st=taskDueState(t);if(taskFilter==='open')return !t.done;if(taskFilter==='today')return !t.done&&st==='today';if(taskFilter==='overdue')return !t.done&&st==='overdue';if(taskFilter==='upcoming')return !t.done&&(st==='upcoming'||st==='later');if(taskFilter==='unscheduled')return !t.done&&!t.due;if(taskFilter==='done')return t.done;return true});if(taskQuery.trim()){const q=taskQuery.trim().toLowerCase();list=list.filter(t=>[t.title,t.notes,t.category,projectName(t.projectId)].join(' ').toLowerCase().includes(q))}list.sort((a,b)=>{if(a.done!==b.done)return Number(a.done)-Number(b.done);if(taskSort==='priority'){const p={high:0,normal:1,low:2};return (p[a.priority]??1)-(p[b.priority]??1)||(a.due||'9999').localeCompare(b.due||'9999')}if(taskSort==='created')return (b.created||0)-(a.created||0);return (a.due||'9999').localeCompare(b.due||'9999')||(a.priority==='high'?-1:0)-(b.priority==='high'?-1:0)||(b.created||0)-(a.created||0)});const completedThisWeek=completed.filter(t=>t.completedAt&&Date.now()-Date.parse(t.completedAt)<7*86400000).length;v.innerHTML=header('Tasks','Focus on the next action. Dates and filters stay one tap away.')+`<section class="task-summary-grid">${stat('PENDING',open.length,'All open tasks','☷')}${stat('OVERDUE',overdue.length,overdue.length?'Needs attention':'Nothing late', '⚑')}${stat('DUE TODAY',dueToday.length,'Deadline today','◷')}${stat('DONE THIS WEEK',completedThisWeek,'Last 7 days','✓')}</section><section class="task-command panel"><form id="taskQuickAdd" class="task-quick-add" autocomplete="off"><input name="title" aria-label="New task title" placeholder="Add a task…" maxlength="180" required><button type="submit" class="primary" aria-label="Add task">＋ Add</button><button type="button" class="task-options" data-action="quickTask" aria-label="More task options" title="Date, priority, project and notes">⌄</button></form><div class="task-filter-row" role="tablist" aria-label="Task filters">${[['open',`Pending <span>${open.length}</span>`],['today',`Today <span>${dueToday.length}</span>`],['overdue',`Overdue <span>${overdue.length}</span>`],['upcoming','Upcoming'],['unscheduled','No date'],['done',`Completed <span>${completed.length}</span>`],['all','All']].map(([k,n])=>`<button type="button" role="tab" aria-selected="${taskFilter===k}" data-filter="${k}" class="task-filter ${taskFilter===k?'selected':''}">${n}</button>`).join('')}</div><div class="task-tools"><label class="task-search"><span aria-hidden="true">⌕</span><input id="taskSearch" type="search" placeholder="Search tasks…" value="${esc(taskQuery)}" aria-label="Search tasks"></label><label class="task-sort-label">Sort <select id="taskSort"><option value="due" ${taskSort==='due'?'selected':''}>Due date</option><option value="priority" ${taskSort==='priority'?'selected':''}>Priority</option><option value="created" ${taskSort==='created'?'selected':''}>Recently added</option></select></label></div><div class="task-list-head"><strong>${taskFilter==='open'?'Pending tasks':taskFilter==='today'?'Due today':taskFilter==='overdue'?'Overdue tasks':taskFilter==='upcoming'?'Upcoming tasks':taskFilter==='unscheduled'?'Tasks without a date':taskFilter==='done'?'Completed tasks':'All tasks'}</strong><span>${list.length} ${list.length===1?'task':'tasks'}</span></div><div class="task-list">${list.map(taskCard).join('')||`<div class="task-empty"><span>${taskFilter==='done'?'✓':taskFilter==='overdue'?'✦':'☷'}</span><strong>${taskQuery?'No matching tasks':taskFilter==='overdue'?'You are clear of overdue tasks':taskFilter==='done'?'No completed tasks yet':'Nothing in this list'}</strong><p>${taskQuery?'Try a different search.':'Capture a task above. Keep it small and make the next action clear.'}</p>${taskFilter!=='open'?`<button type="button" data-filter="open">View pending tasks</button>`:''}</div>`}</div></section>`}

function activityMinutes(a){let ms=db.sessions.filter(s=>(s.day===today())&&(s.activityId===a.id||(!s.activityId&&s.description===a.name))).reduce((n,s)=>n+duration(s),0);if(db.running&&(db.running.activityId===a.id||(!db.running.activityId&&db.running.description===a.name)))ms+=Date.now()-db.running.start;return Math.floor(ms/60000)}

function activityForm(a=null){let edit=a||{},mins=Math.max(0,Math.min(1440,Number(edit.targetMinutes)||0)),hours=Math.floor(mins/60),remainder=mins%60;openModal(a?'Edit activity':'New activity',`<form id="activityForm" class="stack" novalidate><label>Activity name *<input name="name" required maxlength="50" placeholder="e.g. UPSC — Reasoning" value="${esc(edit.name||'')}"></label><div class="grid2"><label>Icon (emoji or symbol)<input name="icon" maxlength="8" value="${esc(edit.icon||'◉')}" placeholder="📚"></label><label>Color<input name="color" type="color" value="${esc(edit.color||'#a78bfa')}" style="height:42px;padding:4px"></label></div><div class="grid2"><label>Category / parent<input name="category" value="${esc(edit.category||'General')}" placeholder="UPSC, Health, Work"></label><label>Labels / tags<input name="tags" value="${esc((edit.tags||[]).join(', '))}" placeholder="Study, Focus"></label></div><label>Daily target behavior<select name="targetMode"><option value="none" ${(!edit.targetMode||edit.targetMode==='none')?'selected':''}>No target</option><option value="min" ${edit.targetMode==='min'?'selected':''}>At least this much (e.g. study)</option><option value="max" ${edit.targetMode==='max'?'selected':''}>Keep below this limit (e.g. idle / sleep)</option></select></label><div class="grid2"><label>Target hours<input name="targetHours" type="number" inputmode="numeric" min="0" max="24" step="1" value="${hours}" placeholder="8"></label><label>Extra minutes<input name="targetRemainder" type="number" inputmode="numeric" min="0" max="59" step="1" value="${remainder}" placeholder="0"></label></div><p class="muted tiny" style="margin-top:-7px">Example: Sleep 8 hours = 8 hours + 0 minutes. Daily maximum is 24 hours. Changes are saved only when you tap Save activity.</p><label class="row"><input name="pinned" type="checkbox" style="width:18px" ${edit.pinned?'checked':''}> Pin to one of the 8 quick-start slots</label><div class="formactions"><button type="submit" cl function timePage(v){let r=db.running,sessions=[...db.sessions].sort((a,b)=>b.start-a.start),totals={};db.sessions.filter(s=>s.day===today()).forEach(s=>totals[s.projectId||'p-general']=(totals[s.projectId||'p-general']||0)+duration(s));v.innerHTML=header('Time tracker','Track the work, not just the clock.',btn('manualEntry','＋ Manual entry')+btn('exportCSV','Export CSV'))+`<section class="timerpanel ${r?'running':''}">${r?`<div class="between"><div><span class="timerpulse"></span><span class="eyebrow" style="color:var(--accent2)">CURRENT SESSION</span><h3 style="font-size:18px;margin:5px 0">${esc(r.description)}</h3><div class="itemmeta">${esc(projectName(r.projectId))} · ${(r.tags||[]).map(t=>chip(t)).join(' ')}</div></div>${chip('Live','good')}</div><div class="timerface" id="liveTimer">${fmtMs(Date.now()-r.start)}</div><div class="formactions">${btn('stopTimer','■ Stop & save','primary')}${btn('switchTimer','⇄ Switch activity')}${btn('editRunning','Edit details','ghost')}</div>`:`<div class="between"><div><div class="eyebrow">NEW SESSION</div><h3 style="font-size:19px;margin:5px 0 0">What are you working on?</h3><p class="muted small">Use a project and tags to make reports meaningful.</p></div>${chip('Ready')}</div>${startForm()}`}</section>

function calendarPage(v){let y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1);let offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);let days=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}let monthLabel=calendarMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});v.innerHTML=header('Calendar','A timeline of time sessions and deadlines.',btn('goTime','＋ Track time','primary'))+`<section class="panel"><div class="calendarhead"><button data-action="prevMonth">←</button><h3 style="margin:0">${monthLabel}</h3><button data-action="nextMonth">→</button></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="muted tiny" style="text-align:center;padding:5px">${x}</div>`).join('')}${days.map(d=>{let k=dateKey(d),isCurrent=d.getMonth()===m,has=daySessions(k).length,hasTask=db.tasks.some(t=>!t.done&&t.due===k);return `<button class="calday ${isCurrent?'':'other'} ${k===today()?'today':''} ${k===selectedDay?'selected':''}" data-day="${k}">${d.getDate()}<div class="dots">${has?'<i></i>'.repeat(Math.min(4,has)):''}${hasTask?'<i style="background:var(--warn)"></i>':''}</div></button>`}).join('')}</div><div class="divider"></div><div class="between"><h3 style="margin:0">${fmtDate(selectedDay)}</h3><span class="chip">${fmtHM(dayTotal(selectedDay))} tracked</span></div><div class="cols" style="margin-top:8px"><div><h3>Time sessions</h3>${sessionRows(daySessions(selectedDay).sort((a,b)=>a.start-b.start))}</div><div><h3>Tasks due</h3>${taskRows(db.tasks.filter(t=>t.due===selectedDay),30)}</div></div></section>`}
function streak(id){let n=0,d=new Date();while(true){let k=dateKey(d);if(!isHabitDone(id,k)){if(k===today()){d.setDate(d.getDate()-1);continue}break}n++;d.setDate(d.getDate()-1);if(n>3000)break}return n}
function lifeRuleDue(rule,day=today()){if(rule.active===false||String(day)<String(rule.startDate||'0000-00-00'))return false;if(rule.endDate&&String(day)>String(rule.endDate))return false;const d=new Date(day+'T12:00:00');if(rule.frequency==='weekly')return d.getDay()===Number(rule.weekday||0);if(rule.frequency==='interval'){const start=new Date((rule.startDate||day)+'T12:00:00'),diff=Math.floor((d-start)/86400000);return diff>=0&&diff%Math.max(1,Number(rule.intervalDays)||1)===0}return true}
function ruleRecord(rule,day=today()){const dayLog=db.lifeRuleLog?.[day];return dayLog&&dayLog[rule.id]||{amount:0,done:false}}
function lifeRuleCard(rule){const rec=ruleRecord(rule),target=Math.max(1,Number(rule.target)||1),quantity=rule.kind==='quantity',done=quantity?Number(rec.amount||0)>=target:!!rec.done,pct=quantity?Math.min(100,Number(rec.amount||0)/target*100):(done?100:0),schedule=rule.frequency==='weekly'?`Every ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][Number(rule.weekday)||0]}`:rule.frequency==='interval'?`Every ${Math.max(1,Number(rule.intervalDays)||1)} days`:'Daily';return `<article class="rule-card ${done?'rule-done':''}"><div class="rule-card-top"><span class="rule-mark">${done?'✓':quantity?'↗':'◆'}</span><div class="rule-content"><strong>${esc(rule.name)}</strong><div class="rule-meta">${esc(schedule)}${rule.time?' · '+esc(rule.time):''}${quantity?' · Target '+esc(String(target))+' '+esc(rule.unit||'units'):''}</div></div>${recordMenu('lifeRule',rule.id,'Life rule options')}</div>${quantity?`<div class="rule-progress"><span style="width:${pct}%"></span></div><div class="rule-quantity-row"><span>${esc(String(Number(rec.amount||0)))} / ${esc(String(target))} ${esc(rule.unit||'units')}</span><div class="rule-quantity-actions"><button type="button" data-action="adjustLifeRule" data-delta="-1" data-id="${esc(rule.id)}" aria-label="Decrease progress" ${Number(rec.amount||0)<=0?'disabled':''}>−</button><button type="button" data-action="adjustLifeRule" data-delta="1" data-id="${esc(rule.id)}" aria-label="Add progress">+ ${esc(String(rule.step||1))} ${esc(rule.unit||'units')}</button><button type="button" data-action="completeLifeRule" data-id="${esc(rule.id)}" class="${done?'good':'primary'}">${done?'✓ Done':'Complete'}</button></div></div>`:`<div class="rule-card-bottom"><span class="muted tiny">${done?'Completed today':'Scheduled for today'}</span><button type="button" data-action="completeLifeRule" data-id="${esc(rule.id)}" class="${done?'good':'primary'}">${done?'✓ Completed':'Mark done'}</button></div>`}</article>`}
function habitsPage(v){let hs=activeHabits(),done=hs.filter(h=>isHabitDone(h.id)).length,allRules=(db.lifeRules||[]),rules=allRules.filter(r=>r.active!==false),dueRules=rules.filter(r=>lifeRuleDue(r)),completedRules=dueRules.filter(r=>{const x=ruleRecord(r);return r.kind==='quantity'?Number(x.amount||0)>=Math.max(1,Number(r.target)||1):!!x.done});const mode=window.habitsSubpage||'habits';v.innerHTML=header('Habits & life rules','Build routines—and define the rules you want to live by.',btn(mode==='rules'?'addLifeRule':'addHabit',mode==='rules'?'＋ New life rule':'＋ New habit','primary'))+`<div class="section-switch"><button type="button" data-action="habitsSubpage" data-mode="habits" class="${mode==='habits'?'active':''}">Habits</button><button type="button" data-action="habitsSubpage" data-mode="rules" class="${mode==='rules'?'active':''}">Life rules <span>${dueRules.length}</span></button></div>${mode==='rules'?`<section class="rule-intro"><div class="rule-intro-icon">✦</div><div><h3>Rules you choose to live by</h3><p>Schedule a rule for a particular day or interval. Track a yes/no commitment or a measurable target like 3 litres of water. These are in-app check-ins, not background notifications.</p></div></section><section class="task-summary-grid">${stat('DUE TODAY',dueRules.length,'Scheduled rules','◷')}${stat('COMPLETED',completedRules.length,'Today’s check-ins','✓')}${stat('TO DO',Math.max(0,dueRules.length-completedRules.length),'Still remaining','◆')}${stat('ACTIVE RULES',rules.length,'All schedules','✦')}</section><section class="panel rule-list-panel"><div class="between"><div><h3>Today’s rules</h3><p class="muted tiny">${fmtDate(today())} · Only rules scheduled for today appear here.</p></div>${btn('addLifeRule','＋ Add','primary')}</div><div class="rule-list">${dueRules.map(lifeRuleCard).join('')||empty('✦','No rules scheduled for today. Add a rule or review your future rules below.')}</div></section><section class="panel"><div class="between"><div><h3>All life rules</h3><p class="muted tiny">Edit schedules, pause rules, or remove a rule.</p></div></div>${allRules.map(r=>`<div class="item"><div class="between"><div><b>${esc(r.name)} ${r.active===false?chip('Paused'):''}</b><div class="itemmeta">${r.frequency==='weekly'?'Weekly · '+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][Number(r.weekday)||0]:r.frequency==='interval'?'Every '+r.intervalDays+' days':'Daily'}${r.time?' · '+esc(r.time):''} · ${r.kind==='quantity'?'Target '+r.target+' '+esc(r.unit||'units'):'Check-in rule'}</div></div>${recordMenu('lifeRule',r.id,'Life rule options')}</div>`).join('')||empty('✦','Create a rule to begin.')}}</section>`:`<section class="stats">${stat('TODAY',`${done}/${hs.length}`,'Habits completed','✳')}${stat('COMPLETION',hs.length?Math.round(done/hs.length*100)+'%':'—','Today’s rate','◉')}${stat('ACTIVE HABITS',hs.length,'Keep the list realistic','▤')}${stat('CHECK-INS',Object.values(db.habitLog).reduce((a,x)=>a+x.length,0),'All-time records','✓')}</section><section class="panel"><div class="between"><h3>Today's check-in</h3><span class="muted tiny">${today()}</span></div><div class="habitgrid">${hs.map(h=>`<div class="habitcard ${isHabitDone(h.id)?'checked':''}"><div class="between"><span class="habitbig">${isHabitDone(h.id)?'✓':'✳'}</span>${chip(`${streak(h.id)} day streak`,streak(h.id)?'good':'')}</div><h3 style="margin:8px 0 2px">${esc(h.name)}</h3><div class="muted tiny">${esc(h.category||'General')} · ${esc(h.frequency||'Daily')}</div><div class="progress" style="margin:10px 0"><span style="width:${isHabitDone(h.id)?100:0}%"></span></div><div class="between"><button type="button" data-action="toggleHabit" data-id="${esc(h.id)}" class="${isHabitDone(h.id)?'good':''}">${isHabitDone(h.id)?'✓ Completed':'Mark done'}</button>${recordMenu('habit',h.id,'Habit options')}</div></div>`).join('')||empty('✳','Create a few repeatable habits. Small habits are easier to sustain.')}</div></section><section class="p   <section class="panel"><div class="between wrap"><div><h3>Budget control</h3><p class="muted small">Limits apply to the selected month; spending is calculated from recorded expenses.</p></div><span class="chip">${budgetEntries.length} active</span></div><form id="budgetForm" class="stack"><div class="grid2"><label>Expense category<select name="category">${FIN_CATS.expense.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Monthly limit (₹)<input name="amount" type="number" min="0" step="0.01" required placeholder="e.g. 5000"></label></div><button type="submit" class="secondary">Save / update budget</button></form><div class="grid2" style="margin-top:12px">${budgetEntries.map(x=>{const pct=x.limit?x.spent/x.limit*100:0;return `<article class="item"><div class="between"><b>${esc(x.category)}</b>${recordMenu('budget',x.category,'Budget options')}</div><div class="between" style="margin-top:8px"><b>${money(x.spent)}</b><span class="muted tiny">of ${money(x.limit)}</span></div><div class="progress" style="margin:8px 0"><span style="width:${Math.min(100,pct)}%;background:${pct>100?'var(--bad)':pct>=80?'var(--warn,var(--accent2))':'var(--accent2)'}"></span></div><div class="between tiny muted"><span>${Math.round(pct)}% used</span><span>${money(x.limit-x.spent)} ${x.spent>x.limit?'over':'left'}</span></div></article>`}).join('')||empty('◎','Set category limits to see how spending compares with your plan.')}</div></section>
  <div class="cols"><section class="panel"><div class="between wrap"><div><h3>Savings goals</h3><p class="muted small">Track progress toward a specific amount.</p></div><span class="chip">${db.finance.goals.length} goals</span></div><form id="financeGoalForm" class="stack"><label>Goal name<input name="name" maxlength="80" required placeholder="Emergency fund, laptop…"></label><div class="grid2"><label>Target (₹)<input name="target" type="number" min="1" step="0.01" required placeholder="100000"></label><label>Already saved (₹)<input name="saved" type="number" min="0" step="0.01" value="0" required></label></div><label>Target date (optional)<input name="dueDate" type="date"></label><button type="submit" class="secondary">＋ Create savings goal</button></form><div style="margin-top:12px">${goalCards||empty('◎','Create a savings goal to track how much remains.')}</div></section>
  <section class="panel"><div class="between wrap"><div><h3>Recurring bills</h3><p class="muted small">Track rent, EMIs, subscriptions and other expected payments. No automatic payments are made.</p></div><span class="chip">${recurring.filter(r=>r.active!==false).length} active</span></div><form id="recurringForm" class="stack"><label>Bill or payment name<input name="name" required maxlength="80" placeholder="Rent, phone, EMI…"></label><div class="grid2"><label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Frequency<select name="frequency"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option></select></label></div><div class="grid2"><label>Next due date<input name="nextDate" type="date" value="${today()}" required></label><label>Category<select name="category">${FIN_CATS.expense.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label></div><button type="submit" class="secondary">＋ Add recurring bill</button></form><div style="margin-top:12px">${recurring.map(r=>`<article class="item"><div class="between"><div><b>${esc(r.name)}</b><div class="itemmeta">${esc(r.category||'Other expense')} · ${esc(r.frequency||'monthly')} · Due ${esc(r.nextDate||'date not set')}</div></div><b>${money(r.amount)}</b></div><div class="between" style="margin-top:8px"><span class="muted tiny">${r.active===false?'Paused':r.nextDate<=today()?'Due / overdue':'Upcoming'}</span><div class="row wrap">${r.active!==false?`<button type="button" class="primary smallbtn" data-action="payRecurring" data-id="${esc(r.id)}">Mark paid</button>`:''}${recordMenu('recurring',r.id,'Bill options')}</div></div></article>`).join('')||empty('↻','Add recurring bills to keep expected payments visible.')}</div></section></div>
  <section class="panel"><div class="between wrap"><div><h3>Transaction ledger</h3><p class="muted small">Search and filter records. Transfers are excluded from income and expense totals.</p></div><span class="chip">${tx.length} shown</span></div><div class="grid2"><label>Search<input id="financeSearch" value="${esc(query)}" placeholder="Description, category, notes…"></label><label>Transaction type<select id="financeTypeFilter"><option value="all" ${typeFilter==='all'?'selected':''}>All types</option><option value="expense" ${typeFilter==='expense'?'selected':''}>Expenses</option><option value="income" ${typeFilter==='income'?'selected':''}>Income</option><option value="transfer" ${typeFilter==='transfer'?'selected':''}>Transfers</option></select></label></div><label style="margin-top:8px">Category filter<select id="financeCategoryFilter"><option value="all">All categories</option>${[...new Set([...FIN_CATS.expense,...FIN_CATS.income])].map(c=>`<option value="${esc(c)}" ${categoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><div class="row wrap" style="margin:12px 0">${chip(tx.length+' entries')} ${chip('Income '+money(sum(tx,'income')),'good')} ${chip('Expenses '+money(sum(tx,'expense')),'bad')}</div><div id="financeLedger">${tx.map(t=>`<div class="item"><div class="between"><div><div class="itemtitle">${esc(t.description)}</div><div class="itemmeta">${esc(t.date)} · ${esc(t.category||'Uncategorised')} · ${esc(accounts.find(a=>a.id===t.accountId)?.name||'Account deleted')}${t.type==='transfer'?' → '+esc(accounts.find(a=>a.id===t.toAccountId)?.name||'Destination'):''}</div></div><b style="color:${t.type==='income'?'var(--good)':t.type==='expense'?'var(--bad)':'var(--accent)'}">${t.type==='income'?'+':t.type==='expense'?'−':'⇄ '}${money(t.amount)}</b></div>${t.notes?`<div class="itemmeta">${esc(t.notes)}</div>`:''}<div class="between"><span class="muted tiny">Entry options</span>${recordMenu('transaction',t.id,'Transaction options')}</div></div>`).join('')||empty('₹','No transactions match these filters.')}</div></section>
  <section class="panel"><h3>Financial safety & data quality</h3><p class="muted small">Mr.Shadow does not connect to banks, verify balances, move money or pay bills. Reconcile your manually entered records with official statements. Keep JSON backups. Transfers between your own accounts are not income or expenses. Savings goals are planning records and do not reserve or move funds.</p></section>`;
}

function notesPage(v){let notes=[...db.notes].filter(n=>(n.title+' '+n.body+' '+(n.tags||[]).join?.(' ')).toLowerCase().includes(noteSearch.toLowerCase())).sort((a,b)=>b.updated-a.updated||b.created-a.created);v.innerHTML=header('Notes','Capture thoughts, meeting notes, ideas and decisions.',btn('addNote','＋ New note','primary'))+`<section class="panel"><div class="formgrid"><label class="wide">Search notes<input id="noteSearch" placeholder="Search title, content or tags…" value="${esc(noteSearch)}"></label></div><div class="grid2" style="margin-top:12px">${notes.map(n=>`<article class="item"><div class="between"><b>${esc(n.title||'Untitled note')}</b>${chip(new Date(n.updated||n.created).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</div><p class="notecard muted small">${esc(n.body)}</p><div class="row wrap">${(n.tags||[]).map(t=>chip(t)).join(' ')}</div><div class="between"><button data-action="editNote" data-id="${n.id}">Open note</button>${recordMenu('note',n.id,'Note options')}</div><input type="hidden" value="${n.id}"></article>`).join('')||empty('▤','No notes match. Save a note to start your personal knowledge base.')}</div></section>`}
function reportsPage(v){let days=[];for(let i=13;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);days.push(dateKey(d))}let max=Math.max(1,...days.map(dayTotal)),total=days.reduce((a,d)=>a+dayTotal(d),0),projects={};db.sessions.filter(s=>days.includes(s.day)).forEach(s=>projects[s.projectId||'p-general']=(projects[s.projectId||'p-general']||0)+duration(s));let all=Object.values(projects).reduce((a,n)=>a+n,0);v.innerHTML=header('Reports & insights','Understand your time patterns without guesswork.',btn('exportCSV','Export CSV')+btn('exportJSON','Full backup'))+`<section class="stats">${stat('LAST 14 DAYS',fmtHM(total),'Tracked time','◷')}${stat('DAILY AVERAGE',fmtHM(total/14),'Across the last 14 days','↗')}${stat('SESSIONS',db.sessions.filter(s=>days.includes(s.day)).length,'Last 14 days','▤')}${stat('TASK COMPLETION',db.tasks.length?Math.round(db.tasks.filter(t=>t.done).length/db.tasks.length*100)+'%':'—','All tasks','✓')}</section><div class="cols"><section class="panel"><h3>Daily tracked time · 14 days</h3>${days.map(d=>`<div class="barrow"><span>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</span><div class="bar"><span style="width:${dayTotal(d)/max*100}%"></span></div><b>${fmtHM(dayTotal(d))}</b></div>`).join('')}</section><section class="panel"><h3>Time by project · 14 days</h3>${Object.entries(projects).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="barrow"><span>${esc(projectName(id))}</span><div class="bar"><span style="width:${n/Math.max(1,all)*100}%"></span></div><b>${fmtHM(n)}</b></div>`).join('')||empty('▥','Track time against projects to get a breakdown.')}</section></div><section class="panel"><h3>What this data can tell you</h3><div class="grid2"><div class="item"><b>Consistency</b><p class="muted small">Compare tracked hours over days and weeks; a gap is information, not failure.</p></div><div class="item"><b>Attention allocation</b><p class="muted small">Project and tag reports show whether your time matches your priorities.</p></div><div class="item"><b>Task estimates</b><p class="muted small">Once you use estimates consistently, compare estimated minutes with actual session duration.</p></div><div class="item"><b>Goal progress</b><p class="muted small">Link sessions and tasks to goals to see effort invested in outcomes.</p></div></div></section>`}
function projectsPage(v){v.innerHTML=header('Projects & tags','A shared vocabulary makes time reports useful.',btn('addProject','＋ Project','primary')+btn('manageTags','Manage tags'))+`<section class="panel"><h3>Projects</h3>${db.projects.map(p=>`<div class="item"><div class="between"><div class="row"><span style="width:10px;height:10px;border-radius:50%;background:${esc(p.color||'#a5b4fc')}"></span><b>${esc(p.name)}</b></div><span class="chip">${db.sessions.filter(s=>s.projectId===p.id).length} sessions</span></div><div class="itemmeta">${fmtHM(db.sessions.filter(s=>s.projectId===p.id).reduce((a,s)=>a+duration(s),0))} tracked · ${db.tasks.filter(t=>t.projectId===p.id).length} tasks</div><div class="between"><span class="muted tiny">Project options</span>${recordMenu('project',p.id,'Project options')}</div></div>`).join('')}</section><section class="panel"><h3>Tags</h3><p class="muted small">Use tags for cross-project concepts like Deep Work, Learning, Admin or Meetings.</p><div class="row wrap">${db.tags.map(t=>chip(t)).join(' ')||'No tags yet.'}</div><div class="itemactions">${btn('manageTags','＋ Add / remove tags')}</div></section>`}
function settingsPage(v){const last=db.settings.lastBackupAt?new Date(db.settings.lastBackupAt).toLocaleString(): 'Never';v.innerHTML=header('Backup & settings','Phone-only · private local data · no cloud database required',btn('exportJSON','⬇ Export backup','primary'))+`<section class="panel"><h3>Personal tracking settings</h3><form id="settingsForm" class="stack"><label>Daily tracked-time target (minutes)<input type="number" min="1" max="1440" name="dailyTargetMinutes" value="${Number(db.settings.dailyTargetMinutes)||240}"></label><label class="row" style="font-size:13px"><input type="checkbox" name="weekStartsMonday" style="width:17px" ${db.settings.weekStartsMonday!==false?'checked':''}> Week starts Monday</label><label class="row" style="font-size:13px"><input type="checkbox" name="backupReminderSunday" style="width:17px" ${db.settings.backupReminderSunday!==false?'checked':''}> Remind me in LifeOS every Sunday to export a backup</label><button class="primary">Save settings</button></form></section><section class="panel"><h3>Backup and restore</h3><div class="successbox">Your records are stored on this phone using IndexedDB, with a localStorage fallback. Export a JSON backup regularly and save it to Google Drive or another safe location. The app cannot silently upload files to Drive without Google sign-in and additional setup.</div><div class="stats" style="margin-top:12px;margin-bottom:10px"><div class="stat"><div class="stathead">LAST BACKUP</div><div class="statnum" style="font-size:17px">${esc(last)}</div><div class="statfoot">Updated when JSON export is requested</div></div><div class="stat"><div class="stathead">STORAGE</div><div class="statnum" style="font-size:17px">On device</div><div class="statfoot">Offline-first · no account</div></div></div><div class="formactions">${btn('exportJSON','⬇ Export JSON backup','primary')}${btn('importJSON','Restore from JSON')}${btn('exportCSV','Export CSV')}</div><input id="importFile" type="file" accept=".json,application/json" hidden><p class="muted small" style="margin-top:12px">Restore checks the file structure before asking permission to replace your current data. Keep at least one backup outside this phone. Last migration: ${db.migration?`Copied from ${esc(db.migration.from)} on ${esc(new Date(db.migration.at).toLocaleString())}.`:'No legacy migration marker.'}</p></section><section class="panel"><h3>Storage health</h3><p class="muted small">IndexedDB is the primary structured store. LifeOS also maintains a best-effort localStorage fallback for recovery. Browser/site-data clearing can still erase both local copies, so keep dated backup files in Google Drive.</p>${btn('checkStorage','Check local storage','ghost')}</section><section class="panel why-lab" id="whyLab"><div class="between"><div><div class="eyebrow">CURIOSITY ENGINE</div><h3>Why Lab · Questions for tomorrow</h3><p class="muted small">Capture a question today, schedule it for tomorrow, learn about it, then close it when you are satisfied. Your questions and notes stay on this device.</p></div><span class="chip">${(db.whyQuestions||[]).filter(q=>q.status!=='completed').length} open</span></div><form id="whyQuestionForm" class="stack why-question-form"><label>Question *<input name="question" required maxlength=240 placeholder="e.g. Why are there four seasons?"></label><div class="formgrid"><label>Question style<select name="questionType">${['Why','How','What','Where','Who','When','Which','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Topic<input name="topic" maxlength=100 placeholder="Earth science, history, technology…"></label><label>Learn on<input type="date" name="plannedFor" required value="${addDays(today(),1)}"></label></div><label>What made you curious? (optional)<textarea name="notes" rows="2" placeholder="What do you already think? What do you want to understand?"></textarea></label><div class="formactions"><button type="submit" class="primary">＋ Save question for tomorrow</button></div></form><div class="divider"></div><h4>Questions to explore</h4><div class="why-question-list">${(db.whyQuestions||[]).filter(q=>q.status!=='completed').sort((a,b)=>String(a.plannedFor).localeCompare(String(b.plannedFor))||Number(a.created)-Number(b.created)).map(q=>`<article class="why-question-card"><div class="between"><span class="chip">${esc(q.questionType||'Why')} · ${esc(q.plannedFor===today()?'Today':q.plannedFor<today()?'Overdue':q.plannedFor===addDays(today(),1)?'Tomorrow':fmtDate(q.plannedFor))}</span>${recordMenu('whyQuestion',q.id,'Question actions')}</div><h4>${esc(q.question)}</h4>${q.topic?`<div class="itemmeta">Topic: ${esc(q.topic)}</div>`:''}${q.notes?`<p class="muted small">${esc(q.notes)}</p>`:''}<div class="itemactions"><button type="button" class="primary" data-action="learnWhyQuestion" data-id="${esc(q.id)}">${q.status==='learning'?'Continue learning':'Learn & answer'}</button><button type="button" data-action="completeWhyQuestion" data-id="${esc(q.id)}" class="good">Close question ✓</button></div></article>`).join('')||empty('✦','No open questions. Capture something you want to understand tomorrow.')}</div><details class="why-archive"><summary>Closed questions (${(db.whyQuestions||[]).filter(q=>q.status==='completed').length})</summary><div class="why-question-list">${(db.whyQuestions||[]).filter(q=>q.status==='completed').sort((a,b)=>String(b.closedAt||'').localeCompare(String(a.closedAt||''))).map(q=>`<article class="why-question-card completed"><div class="between"><span class="chip good">Closed ${esc(q.closedAt||'')}</span><button type="button" data-action="reopenWhyQuestion" data-id="${esc(q.id)}">Reopen</button></div><h4>${esc(q.question)}</h4>${q.notes?`<p class="muted small">${esc(q.notes)}</p>`:''}</article>`).join('')||'<p class="muted small">Completed questions will be kept here.</p>'}</div></details></section><section class="panel"><h3>Danger zone</h3><p class="muted small">Reset is irreversible unless you have a backup.</p>${btn('reset','Reset local LifeOS data','danger')}</section>`}
function addDays(k,n){let d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dateKey(d)}
function openModal(title,body,submitLabel='Save'){ $('#modalRoot').dataset.goalId=''; $('#modalRoot').innerHTML=`<div class="modalback" data-action="modalBackdrop"><div class="modal"><div class="modalhead"><h3>${title}</h3><button type="button" data-action="closeModal" aria-label="Close dialog">✕</button></div>${body}</div></div>`;let f=$('#modalRoot form');if(f)f.dataset.modal='1';}
function closeModal(){$('#modalRoot').innerHTML='';$('#modalRoot').dataset.goalId=''}
function modalTask(task=null){openModal(task?'Edit task':'Quick task',`<form id="modalTask" class="stack"><label>Task title *<input name="title" required value="${esc(task?.title||'')}" placeholder="What do you need to do?" autofocus></label><label>Target date<input type="date" name="due" value="${esc(task?.due||'')}"></label><details><summary style="cursor:pointer;color:var(--accent2);padding:7px 0">＋ Add checklist or optional details</summary><label>Checklist — one step per line<textarea name="checklistText" placeholder="Read chapter 1&#10;Solve 10 questions&#10;Review mistakes">${esc((task?.checklist||[]).map(c=>c.title).join('\n'))}</textarea></label><div class="formgrid"><label>Priority<select name="priority">${['normal','high','low'].map(x=>`<option value="${x}" ${task?.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Category<input name="category" value="${esc(task?.category||'')}" placeholder="UPSC, Job…"></label><label>Project<select name="projectId"><option value="">No project</option>${db.projects.map(p=>`<option value="${p.id}" ${p.id===task?.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Notes<input name="notes" value="${esc(task?.notes||'')}" placeholder="Optional"></label></div></details><div class="formactions"><button type="submit" class="primary">${task?'Save task':'＋ Add task'}</button><button type="button" data-action="closeModal">Cancel</button></div><input type="hidden" name="id" value="${esc(task?.id||'')}"></form>`)}

async function timerStart(fd){if(db.running&&db.running.activityId==='act-idle')stopTimer(false);if(db.running){toast('Stop the current timer before starting another.');return false}const description=String(fd.get('description')||'').trim();if(!description){toast('Enter what you are working on first.');return false}const running={id:uid(),description,projectId:String(fd.get('projectId')||'p-general'),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),activityId:String(fd.get('activityId')||''),category:String(fd.get('category')||''),taskId:String(fd.get('taskId')||''),goalId:String(fd.get('goalId')||''),start:Date.now(),day:today()};db.running=running;try{await commitFormMutation()}catch(err){if(db.running?.id===running.id)db.running=null;toast('Timer could not be saved. Check browser storage.');return false}closeModal();render();toast('Timer started');return true}
function ensureIdleActivity(){if(!Array.isArray(db.activityPresets))db.activityPresets=[];let idle=db.activityPresets.find(a=>a.id==='act-idle'||String(a.name||'').trim().toLowerCase()==='idle');if(!idle){idle={id:'act-idle',name:'Idle',icon:'☕',color:'#fb7185',category:'Personal',tags:['Idle'],pinned:true,targetMode:'max',targetMinutes:120};if(db.activityPresets.filter(a=>a.pinned).length>=8){const last=db.activityPresets.filter(a=>a.pinned).slice(-1)[0];if(last)last.pinned=false}db.activityPresets.push(idle)}else if(idle.id!=='act-idle')idle.id='act-idle';return idle}
function startIdleTimer({quiet=true}={}){if(db.running)return false;const idle=ensureIdleActivity();db.running={id:uid(),description:idle.name,activityId:idle.id,category:idle.category||'Personal',projectId:projectIdForCategory(idle.category||'Personal'),tags:Array.isArray(idle.tags)?[...idle.tags]:['Idle'],taskId:'',goalId:'',start:Date.now(),day:today(),isAutomaticIdle:true};save().catch(e=>console.error('Could not persist automatic idle timer',e));if(!quiet)toast('Idle tracking started');return true}
function stopTimer(resumeIdle=true){if(!db.running){if(resumeIdle)startIdleTimer();return}let r=db.running,end=Date.now(),cursor=r.start;while(cursor<end){let d=new Date(cursor),midnight=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),segmentEnd=Math.min(end,midnight);db.sessions.push({...r,id:uid(),start:cursor,end:segmentEnd,day:dateKey(new Date(cursor))});cursor=segmentEnd}db.running=null;if(resumeIdle){const idle=ensureIdleActivity();db.running={id:uid(),description:idle.name,activityId:idle.id,category:idle.category||'Personal',projectId:projectIdForCategory(idle.category||'Personal'),tags:Array.isArray(idle.tags)?[...idle.tags]:['Idle'],taskId:'',goalId:'',start:end,day:today(),isAutomaticIdle:true}}save().catch(e=>console.error('Timer save failed',e));render();toast(resumeIdle?'Time saved · Idle tracking resumed':'Time entry saved')}
function download(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function validateBackup(d){if(!d||typeof d!=='object'||Array.isArray(d))return false;const required=['tasks','sessions','habits','notes','goals'];if(!required.every(k=>Array.isArray(d[k])))return false;if(d.tasks.length>100000||d.sessions.length>500000||d.habits.length>10000||d.notes.length>100000||d.goals.length>10000)return false;if(d.finance!==undefined&&(!d.finance||typeof d.finance!=='object'||!Array.isArray(d.finance.accounts||[])||!Array.isArray(d.finance.transactions||[])))return false;for(const k of required){if(d[k].some(x=>!x||typeof x!=='object'||Array.isArray(x)))return false}if(d.tasks.some(t=>t.title!==undefined&&typeof t.title!=='string'))return false;if(d.sessions.some(s=>s.start!==undefined&&!Number.isFinite(Number(s.start))))return false;return true}

function normalizeTaskTitle(value){const title=String(value??'').trim();return title.length>0&&title.length<=240?{ok:true,value:title}:{ok:false,value:title,reason:title?'too-long':'empty'};}
function normalizeTaskDueDate(value){const due=String(value??'').trim();if(!due)return {ok:true,value:''};if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return {ok:false,value:due};const d=new Date(due+'T12:00:00');return Number.isFinite(d.getTime())&&dateKey(d)===due?{ok:true,value:due}:{ok:false,value:due};}
function normalizeTaskPriority(value){const priority=String(value??'normal');return ['normal','high','low'].includes(priority)?priority:'normal';}

// All forms are routed through one explicit registry. Each form has one dedicated save/action
// function; there are no competing capture/bubble submit handlers and no duplicate task writes.
const formSubmitLocks = new WeakSet();
async function commitFormMutation(){
  try { await save(); return 'indexeddb'; }
  catch (err) {
    // save() writes the local snapshot synchronously before IndexedDB. Confirm that a usable
    // snapshot exists before treating an IndexedDB failure as a local-only save.
    let snapshot = null;
    try { snapshot = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
    if (snapshot && typeof snapshot === 'object' && snapshot.updatedAt === db.updatedAt) { console.warn('IndexedDB write failed; the current local snapshot was retained.', err); return 'local'; }
    throw err;
  }
}

 if(DEDICATED_FORM_HANDLERS[form.id])return;
 const handler=FORM_HANDLERS[form.id];
 if(!handler)return;
 event.preventDefault();event.stopImmediatePropagation();
 if(formSubmitLocks.has(form))return;
 formSubmitLocks.add(form);
 const button=form.querySelector('button[type="submit"],button:not([type])');
 const originalText=button?.textContent;
 if(button){button.disabled=true;if(!/Saving|Adding|Starting/.test(button.textContent||''))button.textContent='Saving…';}
 try{await handler(form)}catch(error){console.error('Form action failed:',form.id,error);toast('This action failed. Your existing records were not intentionally cleared. Please retry or export a backup.');}
 finally{formSubmitLocks.delete(form);if(button&&button.isConnected){button.disabled=false;if(originalText!==undefined)button.textContent=originalText;}}
},true);
document.addEventListener('input',e=>{if(e.target.id==='commandSearch'){const q=e.target.value.trim().toLocaleLowerCase();let visible=0;$$('#commandList .command-option').forEach(b=>{const show=(b.dataset.command+' '+b.innerText).toLocaleLowerCase().includes(q);b.hidden=!show;if(show)visible++});$('#commandEmpty')?.classList.toggle('show',visible===0)}if(e.target.id==='taskSearch'){taskQuery=e.target.value;const el=e.target,st=el.selectionStart;tasksPage($('#main'));const next=$('#taskSearch');next?.focus();if(next&&st!==null)next.setSelectionRange(st,st)}if(e.target.id==='financeSearch'){const q=e.target.value;const pos=e.target.selectionStart;financePage($('#main'));const n=$('#financeSearch');n?.focus();if(n&&pos!==null)n.setSelectionRange(pos,pos)}if(e.target.id==='noteSearch'){noteSearch=e.target.value;let pos=e.target.selectionStart;notesPage($('#main'));let n=$('#noteSearch');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='sessionFrom'||e.target.id==='sessionTo'){let from=$('#sessionFrom')?.value,to=$('#sessionTo')?.value;let list=db.sessions.filter(s=>(!from||s.day>=from)&&(!to||s.day<=to)).sort((a,b)=>b.start-a.start);$('#sessionList').innerHTML=sessionRows(list)}});
document.addEventListener('change',e=>{if(e.target.id==='taskSort'){taskSort=['due','priority','created'].includes(e.target.value)?e.target.value:'due';tasksPage($('#main'))}if(e.target.name==='type'&&e.target.closest('#transactionForm')){let type=e.target.value,cat=$('#txCategory'),wrap=$('#toAccountWrap');if(cat){cat.innerHTML=(FIN_CATS[type]||FIN_CATS.expense).map(c=>`<option>${esc(c)}</option>`).join('');cat.disabled=type==='transfer'}if(wrap)wrap.classList.toggle('hide',type!=='transfer')}if(['financeMonth','financeTypeFilter','financeCategoryFilter'].includes(e.target.id)){financePage($('#main'))}if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!validateBackup(x))throw Error('This file does not look like a valid LifeOS backup. Required record collections are missing or malformed.');if(confirm('Replace local LifeOS data with this backup? Export current data first.')){db=normalize(x);save();render();toast('Backup restored')}}catch(err){alert('Import failed: '+err.message)}e.target.value=''};reader.readAsText(e.target.files[0])}});

async function init(){const localSnapshot=normalize(db);try{const saved=await readIDB();const savedValid=saved&&validateBackup(saved);const localTime=Date.parse(localSnapshot.updatedAt||'')||0,idbTime=savedValid?(Date.parse(saved.updatedAt||'')||0):0;db=savedValid&&idbTime>localTime?normalize(saved):localSnapshot;if(!Array.isArray(db.activityPresets)||!db.activityPresets.length)db.activityPresets=DEFAULT_ACTIVITIES.map(x=>({...x}));ensureIdleActivity();if(!db.running)startIdleTimer();await writeIDB(db);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('Could not refresh localStorage snapshot',e)}}catch(err){console.warn('IndexedDB unavailable; using localStorage fallback',err);db=localSnapshot;if(!Array.isArray(db.activityPresets)||!db.activityPresets.length)db.activityPresets=DEFAULT_ACTIVITIES.map(x=>({...x}));ensureIdleActivity();if(!db.running)startIdleTimer();try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render()}
