function normalize(old){const d=fresh();if(!old||typeof old!=='object')return d;for(const k of ['tasks','sessions','habits','habitLog','notes','running','projects','tags','goals','settings','finance','reminders'])if(old[k]!==undefined)d[k]=old[k];d.projects=(Array.isArray(d.projects)&&d.projects.length?d.projects:fresh().projects).map((p,i)=>typeof p==='string'?{id:'p-'+i,name:p,color:'#a5b4fc'}:{id:p.id||uid(),name:p.name||p.title||'Project',color:p.color||'#a5b4fc'});d.tags=Array.isArray(d.tags)?d.tags:fresh().tags;d.tasks=d.tasks.map(t=>({...t,id:t.id||uid(),title:t.title||t.name||'Untitled task',done:!!(t.done||t.completed),created:t.created||Date.now(),priority:t.priority||'normal'}));d.sessions=d.sessions.map(s=>{let start=Number(s.start)||Date.now(),end=s.end==null?null:Number(s.end);return {...s,id:s.id||uid(),description:s.description||s.task||s.title||'Time entry',project:s.project||'General',tags:Array.isArray(s.tags)?s.tags:[],start,end,day:s.day||dateKey(new Date(start))}});d.habits=d.habits.map(h=>typeof h==='string'?{id:uid(),name:h,active:true}:{...h,id:h.id||uid(),name:h.name||h.title||'Habit',active:h.active!==false});d.notes=d.notes.map(n=>({...n,id:n.id||uid(),title:n.title||'',body:n.body||n.content||'',created:n.created||Date.now()}));d.goals=d.goals.map(g=>({...g,id:g.id||uid(),title:g.title||g.name||'Goal',target:Number(g.target)||1,current:Number(g.current)||0}));return d}
function load(){let x;try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(x?.schemaVersion===3)return normalize(x);let old=null,from=null;for(const k of OLD_KEYS){try{let candidate=JSON.parse(localStorage.getItem(k)||'null');if(candidate&&typeof candidate==='object'){old=candidate;from=k;break}}catch{}}let d=normalize(old);if(from)d.migration={from,at:new Date().toISOString(),legacyPreserved:true};localStorage.setItem(KEY,JSON.stringify(d));return d}
let db=load(),page='home',taskFilter='open',timeRange='week',selectedDay=today(),calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),noteSearch='',reportGroup='project',syncClient=null,syncUser=null,syncStatus='Local only',timerInterval=null;
const save=()=>{db.schemaVersion=3;db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db))},projectName=id=>db.projects.find(p=>p.id===id)?.name||id||'General',projectId=name=>db.projects.find(p=>p.name.toLowerCase()===String(name||'').toLowerCase())?.id||'p-general',duration=s=>Math.max(0,(s.end||Date.now())-s.start),fmtMs=n=>{n=Math.max(0,Math.floor(n/1000));let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`},fmtHM=n=>{let m=Math.round(Math.max(0,n)/60000);return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`},fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:new Date().getFullYear()!==Number(d.slice(0,4))?'numeric':undefined}):'No date',localTime=n=>new Date(n).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),daySessions=d=>db.sessions.filter(s=>s.day===d),dayTotal=d=>daySessions(d).reduce((a,s)=>a+duration(s),0),openTasks=()=>db.tasks.filter(t=>!t.done),activeHabits=()=>db.habits.filter(h=>h.active!==false),loggedHabits=d=>db.habitLog[d]||[],isHabitDone=(id,d=today())=>loggedHabits(d).includes(id),goalPct=g=>Math.max(0,Math.min(100,(Number(g.current)||0)/(Number(g.target)||1)*100)),toast=m=>{let e=$('#toast');e.textContent=m;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2500)},empty=(ico,msg)=>`<div class="empty"><span class="emptyico">${ico}</span>${esc(msg)}</div>`,chip=(txt,cls='')=>`<span class="chip ${cls}">${esc(txt)}</span>`;

<section class="panel"><div class="between"><h3>Today's tasks</h3>${btn('goTasks','View all →','ghost')}</div>${taskRows(todayTasks,5)}<form id="quickTaskForm" class="row" style="margin-top:10px"><input name="title" placeholder="Add a task quickly…" required><button class="primary">Add</button></form></section></div>

<section class="panel"><div class="between"><h3>Active goals</h3>${btn('goGoals','View all →','ghost')}</div>${db.goals.filter(g=>g.status!=='done').slice(0,4).map(g=>`<div class="item"><div class="between"><b>${esc(g.title)}</b>${chip(Math.round(goalPct(g))+'%')}</div><div class="progress" style="margin:10px 0"><span style="width:${goalPct(g)}%"></span></div><div class="between tiny muted"><span>${esc(String(g.current||0))} / ${esc(String(g.target||1))} ${esc(g.unit||'units')}</span><span>${g.deadline?esc(fmtDate(g.deadline)):'No deadline'}</span></div></div>`).join('')||empty('◎','Set a goal and define a measurable target.')}</section>
<section class="panel"><div class="between"><h3>Last 7 days</h3>${btn('goReports','Reports →','ghost')}</div>${week.map(d=>`<div class="barrow"><span>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})}</span><div class="bar"><span style="width:${Math.min(100,dayTotal(d)/Math.max(1,...week.map(dayTotal)) *100)}%"></span></div><b>${fmtHM(dayTotal(d))}</b></div>`).join('')}</section></div></div>`}
function tasksPage(v){let list=[...db.tasks].filter(t=>taskFilter==='all'||(taskFilter==='open'?!t.done:taskFilter==='done'?t.done:taskFilter==='today'?(!t.done&&t.due===today()):taskFilter==='overdue'?(!t.done&&t.due&&t.due<today()):!t.done&&t.due&&t.due>=today()&&t.due<=addDays(today(),7))).sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999')||(b.created||0)-(a.created||0));
v.innerHTML=header('Tasks','Capture it, set a date, and check it off.',btn('quickTask','＋ Quick add','primary'))+`<section class="panel"><form id="taskForm" class="stack"><div class="formgrid"><label class="wide">Task title *<input name="title" placeholder="What needs to get done?" required></label><label>Target date<input type="date" name="due"></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label><label>Category<input name="category" placeholder="UPSC, Job, Personal…"></label><label>Project<select name="projectId"><option value="">No project</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="wide">Notes / steps<textarea name="notes" placeholder="Optional context or checklist details"></textarea></label></div><button class="primary">＋ Add task</button></form><div class="row wrap" style="margin-top:15px">${[['open','Open'],['today','Due today'],['overdue','Overdue'],['upcoming','Next 7 days'],['all','All tasks'],['done','Completed']].map(([k,n])=>`<button data-filter="${k}" class="${taskFilter===k?'primary':''}">${n}</button>`).join('')}</div><div style="margin-top:8px">${taskRows(list)}</div></section>`}
function timePage(v){let r=db.running,sessions=[...db.sessions].sort((a,b)=>b.start-a.start),totals={};db.sessions.filter(s=>s.day===today()).forEach(s=>totals[s.projectId||'p-general']=(totals[s.projectId||'p-general']||0)+duration(s));v.innerHTML=header('Time tracker','Track the work, not just the clock.',btn('manualEntry','＋ Manual entry')+btn('exportCSV','Export CSV'))+`<section class="timerpanel ${r?'running':''}">${r?`<div class="between"><div><span class="timerpulse"></span><span class="eyebrow" style="color:var(--accent2)">CURRENT SESSION</span><h3 style="font-size:18px;margin:5px 0">${esc(r.description)}</h3><div class="itemmeta">${esc(projectName(r.projectId))} · ${(r.tags||[]).map(t=>chip(t)).join(' ')}</div></div>${chip('Live','good')}</div><div class="timerface" id="liveTimer">${fmtMs(Date.now()-r.start)}</div><div class="formactions">${btn('stopTimer','■ Stop & save','primary')}${btn('switchTimer','⇄ Switch activity')}${btn('editRunning','Edit details','ghost')}</div>`:`<div class="between"><div><div class="eyebrow">NEW SESSION</div><h3 style="font-size:19px;margin:5px 0 0">What are you working on?</h3><p class="muted small">Use a project and tags to make reports meaningful.</p></div>${chip('Ready')}</div>${startForm()}`}</section>
<div class="cols" style="margin-top:13px"><section class="panel"><div class="between"><h3>Today's time by project</h3><b>${fmtHM(dayTotal(today()))}</b></div>${Object.keys(totals).length?Object.entries(totals).sort((a,b)=>b[1]-a[1]).map(([id,m])=>`<div class="barrow"><span>${esc(projectName(id))}</span><div class="bar"><span style="width:${m/Math.max(...Object.values(totals))*100}%"></span></div><b>${fmtHM(m)}</b></div>`).join(''):empty('◷','Your tracked time will appear here.')}</section><section class="panel"><h3>Daily target</h3><div class="between"><span class="muted">Today's tracked time</span><b>${Math.round(dayTotal(today())/60000)} / ${Number(db.settings.dailyTargetMinutes)||240} min</b></div><div class="progress" style="margin:12px 0"><span style="width:${Math.min(100,dayTotal(today())/((Number(db.settings.dailyTargetMinutes)||240)*60000)*100)}%"></span></div><p class="muted tiny">Change the target in Backup & settings. Time sessions are never counted twice when linked to a task or goal.</p></section></div>
<section class="panel"><div class="between"><h3>Time entries</h3><span class="chip">${sessions.length} sessions</span></div><div class="formgrid"><label>From date<input id="sessionFrom" type="date"></label><label>To date<input id="sessionTo" type="date"></label></div><div id="sessionList">${sessionRows(sessions.slice(0,100))}</div></section>`}
function startForm(s=null){return `<form id="startForm" class="stack"><div class="formgrid"><label class="wide">Description *<input name="description" required placeholder="e.g. Read Laxmikanth — Parliament" value="${esc(s?.description||'')}"></label><label>Project<select name="projectId">${db.projects.map(p=>`<option value="${p.id}" ${s?.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Tags<input name="tags" placeholder="Deep Work, Reading" value="${esc((s?.tags||[]).join(', '))}"></label><label class="wide">Link to task (optional)<select name="taskId"><option value="">No linked task</option>${db.tasks.filter(t=>!t.done).map(t=>`<option value="${t.id}" ${s?.taskId===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label></div><button class="primary">▶ Start timer</button></form>`}
function sessionRows(sessions){return sessions.map(s=>`<div class="item"><div class="between"><div class="itemtitle">${esc(s.description)}</div><b>${fmtHM(duration(s))}</b></div><div class="itemmeta">${esc(s.day)} · ${localTime(s.start)}–${s.end?localTime(s.end):'running'} · ${esc(projectName(s.projectId))}${s.manual?' · Manual entry':''}</div><div class="row wrap" style="margin-top:7px">${(s.tags||[]).map(t=>chip(t)).join(' ')}</div><div class="itemactions"><button data-action="editSession" data-id="${s.id}">Edit</button><button data-action="duplicateSession" data-id="${s.id}" class="ghost">Duplicate</button><button data-action="deleteSession" data-id="${s.id}" class="danger ghost">Delete</button></div><input type="hidden" value="${s.id}"></div>`).join('')||empty('◷','No entries for this range.')}
function calendarPage(v){let y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1);let offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);let days=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}let monthLabel=calendarMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});v.innerHTML=header('Calendar','A timeline of time sessions and deadlines.',btn('goTime','＋ Track time','primary'))+`<section class="panel"><div class="calendarhead"><button data-action="prevMonth">←</button><h3 style="margin:0">${monthLabel}</h3><button data-action="nextMonth">→</button></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="muted tiny" style="text-align:center;padding:5px">${x}</div>`).join('')}${days.map(d=>{let k=dateKey(d),isCurrent=d.getMonth()===m,has=daySessions(k).length,hasTask=db.tasks.some(t=>!t.done&&t.due===k);return `<button class="calday ${isCurrent?'':'other'} ${k===today()?'today':''} ${k===selectedDay?'selected':''}" data-day="${k}">${d.getDate()}<div class="dots">${has?'<i></i>'.repeat(Math.min(4,has)):''}${hasTask?'<i style="background:var(--warn)"></i>':''}</div></button>`}).join('')}</div><div class="divider"></div><div class="between"><h3 style="margin:0">${fmtDate(selectedDay)}</h3><span class="chip">${fmtHM(dayTotal(selectedDay))} tracked</span></div><div class="cols" style="margin-top:8px"><div><h3>Time sessions</h3>${sessionRows(daySessions(selectedDay).sort((a,b)=>a.start-b.start))}</div><div><h3>Tasks due</h3>${taskRows(db.tasks.filter(t=>t.due===selectedDay),30)}</div></div></section>`}
function streak(id){let n=0,d=new Date();while(true){let k=dateKey(d);if(!isHabitDone(id,k)){if(k===today()){d.setDate(d.getDate()-1);continue}break}n++;d.setDate(d.getDate()-1);if(n>3000)break}return n}
function habitsPage(v){let hs=activeHabits(),done=hs.filter(h=>isHabitDone(h.id)).length;v.innerHTML=header('Habits','Consistency is built by showing up repeatedly.',btn('addHabit','＋ New habit','primary'))+`<section class="stats">${stat('TODAY',`${done}/${hs.length}`,'Habits completed','✳')}${stat('COMPLETION',hs.length?Math.round(done/hs.length*100)+'%':'—','Today’s rate','◉')}${stat('ACTIVE HABITS',hs.length,'Keep the list realistic','▤')}${stat('CHECK-INS',Object.values(db.habitLog).reduce((a,x)=>a+x.length,0),'All-time records','✓')}</section><section class="panel"><div class="between"><h3>Today's check-in</h3><span class="muted tiny">${today()}</span></div><div class="habitgrid">${hs.map(h=>`<div class="habitcard ${isHabitDone(h.id)?'checked':''}"><div class="between"><span class="habitbig">${isHabitDone(h.id)?'✓':'✳'}</span>${chip(`${streak(h.id)} day streak`,streak(h.id)?'good':'')}</div><h3 style="margin:8px 0 2px">${esc(h.name)}</h3><div class="muted tiny">${esc(h.category||'General')} · ${esc(h.frequency||'Daily')}</div><div class="progress" style="margin:10px 0"><span style="width:${isHabitDone(h.id)?100:0}%"></span></div><div class="formactions"><button data-action="toggleHabit" data-id="${h.id}" class="${isHabitDone(h.id)?'good':''}">${isHabitDone(h.id)?'✓ Completed':'Mark done'}</button><button data-action="editHabit" data-id="${h.id}">Edit</button></div></div>`).join('')||empty('✳','Create a few repeatable habits. Small habits are easier to sustain.')}</div></section><section class="panel"><h3>Last 7 days</h3>${hs.map(h=>`<div class="item"><div class="between"><b>${esc(h.name)}</b><span class="muted tiny">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return isHabitDone(h.id,dateKey(d))?'●':'○'}).join(' ')}</span></div></div>`).join('')||empty('▦','Your weekly habit history will appear here.')}</section>`}
function goalsPage(v){let goals=db.goals;v.innerHTML=header('Goals','Turn ambitions into measurable progress and daily action.',btn('addGoal','＋ Create goal','primary'))+`<section class="stats">${stat('ACTIVE GOALS',goals.filter(g=>g.status!=='done').length,'In progress','◎')}${stat('COMPLETED',goals.filter(g=>g.status==='done').length,'Goals achieved','✓')}${stat('LINKED TASKS',db.tasks.filter(t=>t.goalId&&!t.done).length,'Open tasks','☷')}${stat('TRACKED TIME',fmtHM(db.sessions.filter(s=>s.goalId).reduce((a,s)=>a+duration(s),0)),'Sessions linked to goals','◷')}</section><section class="panel"><div class="stack">${goals.map(g=>{let related=db.tasks.filter(t=>t.goalId===g.id),hours=db.sessions.filter(s=>s.goalId===g.id).reduce((a,s)=>a+duration(s),0);return `<div class="item"><div class="between"><div><div class="itemtitle">${esc(g.title)}</div><div class="itemmeta">${esc(g.category||'Personal growth')} · ${g.deadline?'Target '+esc(fmtDate(g.deadline)):'No deadline'}</div></div>${chip(g.status==='done'?'Completed':Math.round(goalPct(g))+'% ',g.status==='done'?'good':'')}</div><div class="progress" style="margin:12px 0"><span style="width:${goalPct(g)}%"></span></div><div class="between small"><span>${esc(String(g.current||0))} / ${esc(String(g.target||1))} ${esc(g.unit||'units')}</span><span class="muted">${related.filter(t=>t.done).length}/${related.length} linked tasks · ${fmtHM(hours)} linked time</span></div>${g.why?`<p class="muted small">${esc(g.why)}</p>`:''}<div class="itemactions"><button data-action="updateGoal" data-id="${g.id}">＋ Progress</button><button data-action="goalTask" data-id="${g.id}">＋ Linked task</button><button data-action="editGoal" data-id="${g.id}" class="ghost">Edit</button><button data-action="deleteGoal" data-id="${g.id}" class="danger ghost">Delete</button></div><input type="hidden" value="${g.id}"></div>`}).join('')||empty('◎','Define a goal, a measurable target and a deadline. Then link tasks and time sessions to it.')}</div></section>`}

const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
const FIN_CATS={expense:['Food & groceries','Transport','Bills & utilities','Shopping','Health','Education','Entertainment','Rent & housing','Subscriptions','Family','Travel','Fees & charges','Other expense'],income:['Salary','Freelance','Business','Interest','Investment returns','Gift','Refund','Other income'],transfer:['Account transfer']};
function financePage(v){
  if(!db.finance||typeof db.finance!=='object')db.finance={accounts:[],transactions:[],budgets:{}};
  db.finance.accounts=Array.isArray(db.finance.accounts)?db.finance.accounts:[];
  db.finance.transactions=Array.isArray(db.finance.transactions)?db.finance.transactions:[];
  db.finance.budgets=db.finance.budgets||{};
  const month=$('#financeMonth')?.value||today().slice(0,7);
  const tx=db.finance.transactions.filter(t=>String(t.date||'').startsWith(month)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
  const accounts=db.finance.accounts;
  const balance=a=>Number(a.openingBalance||0)+db.finance.transactions.reduce((sum,t)=>sum+(t.accountId===a.id?(t.type==='income'?Number(t.amount):t.type==='expense'?-Number(t.amount):t.type==='transfer'?-Number(t.amount):0):0)+(t.type==='transfer'&&t.toAccountId===a.id?Number(t.amount):0),0);
  const monthIncome=tx.filter(t=>t.type==='income').reduce((n,t)=>n+Number(t.amount),0);
  const monthExpense=tx.filter(t=>t.type==='expense').reduce((n,t)=>n+Number(t.amount),0);
  const budgetTotal=Object.values(db.finance.budgets).reduce((n,x)=>n+Number(x||0),0);
  const byCat={};tx.filter(t=>t.type==='expense').forEach(t=>byCat[t.category||'Other expense']=(byCat[t.category||'Other expense']||0)+Number(t.amount));
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const accountOpts=accounts.map(a=>`<option value="${a.id}">${esc(a.name)} (${money(balance(a))})</option>`).join('');
  v.innerHTML=header('Financial management','Manual income, expenses, transfers, account balances and budgets.',btn('exportCSV','Export CSV')+btn('exportJSON','Full backup'))+
  `<section class="stats">${stat('TOTAL BALANCE',money(accounts.reduce((n,a)=>n+balance(a),0)),'Across tracked accounts','₹')}${stat('INCOME THIS MONTH',money(monthIncome),'Manual entries','↗')}${stat('EXPENSES THIS MONTH',money(monthExpense),'Manual entries','↘')}${stat('NET CASH FLOW',money(monthIncome-monthExpense),monthIncome>=monthExpense?'Income exceeds expenses':'Expenses exceed income',monthIncome>=monthExpense?'✓':'!')}</section>
  <div class="cols"><section class="panel"><div class="between"><h3>Accounts & wallets</h3><span class="chip">${accounts.length} accounts</span></div>
  ${accounts.map(a=>`<div class="item"><div class="between"><div><b>${esc(a.name)}</b><div class="itemmeta">${esc(a.kind||'Bank account')}${a.last4?' · •••• '+esc(a.last4):''}</div></div><b>${money(balance(a))}</b></div><div class="itemmeta">Opening balance: ${money(a.openingBalance||0)}</div><div class="itemactions"><button data-action="editAccount" data-id="${a.id}">Edit</button><button data-action="deleteAccount" data-id="${a.id}" class="danger ghost">Delete</button></div></div>`).join('')||empty('₹','Add your bank accounts, cash wallet or cards. You enter transactions manually; no bank credentials are needed.')}
  <div class="divider"></div><h3>Add an account</h3><form id="accountForm" class="stack"><label>Account name *<input name="name" required placeholder="e.g. SBI Savings, Cash wallet"></label><div class="grid2"><label>Type<select name="kind"><option>Bank account</option><option>Cash</option><option>Credit card</option><option>Wallet / UPI</option><option>Investment account</option><option>Other</option></select></label><label>Opening balance (₹)<input name="openingBalance" type="number" step="0.01" value="0" required></label></div><label>Last four digits (optional)<input name="last4" maxlength="4" inputmode="numeric" placeholder="1234"></label><button class="primary">＋ Add account</button></form></section>
  <section class="panel"><h3>Record a transaction</h3>${accounts.length?`<form id="transactionForm" class="stack"><div class="grid2"><label>Type<select name="type" id="txType"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer between accounts</option></select></label><label>Amount (₹) *<input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></label></div><label>Description *<input name="description" required placeholder="e.g. Groceries, salary credited"></label><div class="grid2"><label>Date<input name="date" type="date" value="${today()}" required></label><label>Category<select name="category" id="txCategory">${FIN_CATS.expense.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label></div><label>From account / paid using<select name="accountId" required>${accountOpts}</select></label><label id="toAccountWrap" class="hide">Transfer to<select name="toAccountId">${accountOpts}</select></label><label>Notes (optional)<input name="notes" placeholder="Reference, context, who paid…"></label><button class="primary">＋ Save transaction</button></form>`:`<div class="notice">Add at least one account before recording transactions.</div>`}
  <div class="divider"></div><h3>Monthly expense categories</h3>${cats.map(([c,n])=>`<div class="barrow"><span>${esc(c)}</span><div class="bar"><span style="width:${n/Math.max(1,...cats.map(x=>x[1]))*100}%"></span></div><b>${money(n)}</b></div>`).join('')||empty('▥','Your spending breakdown will appear after you record expenses.')}</section></div>
  <section class="panel"><div class="between wrap"><h3>Transactions</h3><label style="max-width:180px">Month<input type="month" id="financeMonth" value="${esc(month)}"></label></div><div class="row wrap" style="margin:8px 0 12px">${chip(tx.length+' entries')} ${chip('Income '+money(tx.filter(t=>t.type==='income').reduce((n,t)=>n+Number(t.amount),0)),'good')} ${chip('Expenses '+money(tx.filter(t=>t.type==='expense').reduce((n,t)=>n+Number(t.amount),0)),'bad')}</div>
  ${tx.map(t=>`<div class="item"><div class="between"><div><div class="itemtitle">${esc(t.description)}</div><div class="itemmeta">${esc(t.date)} · ${esc(t.category||'Uncategorised')} · ${esc(accounts.find(a=>a.id===t.accountId)?.name||'Account deleted')}${t.type==='transfer'?' → '+esc(accounts.find(a=>a.id===t.toAccountId)?.name||'Destination'):''}</div></div><b style="color:${t.type==='income'?'var(--good)':t.type==='expense'?'var(--bad)':'var(--accent)'}">${t.type==='income'?'+':t.type==='expense'?'−':'⇄ '}${money(t.amount)}</b></div>${t.notes?`<div class="itemmeta">${esc(t.notes)}</div>`:''}<div class="itemactions"><button data-action="editTransaction" data-id="${t.id}">Edit</button><button data-action="deleteTransaction" data-id="${t.id}" class="danger ghost">Delete</button></div></div>`).join('')||empty('₹','No transactions for this month. Your records start when you add them.')}</section>
  <section class="panel"><div class="between"><h3>Monthly category budgets</h3>${chip(month)}</div><p class="muted small">Set monthly spending limits by category. Budgets are planning targets, not bank-linked alerts.</p><form id="budgetForm" class="stack"><div class="grid2"><label>Expense category<select name="category">${FIN_CATS.expense.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Monthly limit (₹)<input name="amount" type="number" min="0" step="0.01" required placeholder="e.g. 5000"></label></div><button class="primary">Save category budget</button></form>${FIN_CATS.expense.filter(c=>Number(db.finance.budgets[c])>0).map(c=>{let spent=byCat[c]||0,limit=Number(db.finance.budgets[c]);return `<div class="item"><div class="between"><b>${esc(c)}</b><span>${money(spent)} / ${money(limit)}</span></div><div class="progress" style="margin:9px 0"><span style="width:${Math.min(100,spent/limit*100)}%;background:${spent>limit?'var(--bad)':'var(--accent2)'}"></span></div><div class="between tiny muted"><span>${Math.round(spent/limit*100)}% used</span><button data-action="deleteBudget" data-category="${esc(c)}" class="ghost danger">Remove</button></div></div>`}).join('')||empty('◎','Add budgets for the spending categories you want to manage.')}</section>
  <section class="panel"><h3>Financial safety</h3><p class="muted small">LifeOS does not connect to your banks or verify balances. Keep transaction amounts accurate, reconcile account balances periodically, and export backups. Credit-card purchases are recorded as expenses; payments between your own accounts should be transfers to avoid counting them as income.</p></section>`;
}

function notesPage(v){let notes=[...db.notes].filter(n=>(n.title+' '+n.body+' '+(n.tags||[]).join?.(' ')).toLowerCase().includes(noteSearch.toLowerCase())).sort((a,b)=>b.updated-a.updated||b.created-a.created);v.innerHTML=header('Notes','Capture thoughts, meeting notes, ideas and decisions.',btn('addNote','＋ New note','primary'))+`<section class="panel"><div class="formgrid"><label class="wide">Search notes<input id="noteSearch" placeholder="Search title, content or tags…" value="${esc(noteSearch)}"></label></div><div class="grid2" style="margin-top:12px">${notes.map(n=>`<article class="item"><div class="between"><b>${esc(n.title||'Untitled note')}</b>${chip(new Date(n.updated||n.created).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</div><p class="notecard muted small">${esc(n.body)}</p><div class="row wrap">${(n.tags||[]).map(t=>chip(t)).join(' ')}</div><div class="itemactions"><button data-action="editNote" data-id="${n.id}">Open / edit</button><button data-action="deleteNote" data-id="${n.id}" class="danger ghost">Delete</button></div><input type="hidden" value="${n.id}"></article>`).join('')||empty('▤','No notes match. Save a note to start your personal knowledge base.')}</div></section>`}
function reportsPage(v){let days=[];for(let i=13;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);days.push(dateKey(d))}let max=Math.max(1,...days.map(dayTotal)),total=days.reduce((a,d)=>a+dayTotal(d),0),projects={};db.sessions.filter(s=>days.includes(s.day)).forEach(s=>projects[s.projectId||'p-general']=(projects[s.projectId||'p-general']||0)+duration(s));let all=Object.values(projects).reduce((a,n)=>a+n,0);v.innerHTML=header('Reports & insights','Understand your time patterns without guesswork.',btn('exportCSV','Export CSV')+btn('exportJSON','Full backup'))+`<section class="stats">${stat('LAST 14 DAYS',fmtHM(total),'Tracked time','◷')}${stat('DAILY AVERAGE',fmtHM(total/14),'Across the last 14 days','↗')}${stat('SESSIONS',db.sessions.filter(s=>days.includes(s.day)).length,'Last 14 days','▤')}${stat('TASK COMPLETION',db.tasks.length?Math.round(db.tasks.filter(t=>t.done).length/db.tasks.length*100)+'%':'—','All tasks','✓')}</section><div class="cols"><section class="panel"><h3>Daily tracked time · 14 days</h3>${days.map(d=>`<div class="barrow"><span>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}</span><div class="bar"><span style="width:${dayTotal(d)/max*100}%"></span></div><b>${fmtHM(dayTotal(d))}</b></div>`).join('')}</section><section class="panel"><h3>Time by project · 14 days</h3>${Object.entries(projects).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="barrow"><span>${esc(projectName(id))}</span><div class="bar"><span style="width:${n/Math.max(1,all)*100*100}%"></span></div><b>${fmtHM(n)}</b></div>`).join('')||empty('▥','Track time against projects to get a breakdown.')}</section></div><section class="panel"><h3>What this data can tell you</h3><div class="grid2"><div class="item"><b>Consistency</b><p class="muted small">Compare tracked hours over days and weeks; a gap is information, not failure.</p></div><div class="item"><b>Attention allocation</b><p class="muted small">Project and tag reports show whether your time matches your priorities.</p></div><div class="item"><b>Task estimates</b><p class="muted small">Once you use estimates consistently, compare estimated minutes with actual session duration.</p></div><div class="item"><b>Goal progress</b><p class="muted small">Link sessions and tasks to goals to see effort invested in outcomes.</p></div></div></section>`}
function projectsPage(v){v.innerHTML=header('Projects & tags','A shared vocabulary makes time reports useful.',btn('addProject','＋ Project','primary')+btn('manageTags','Manage tags'))+`<section class="panel"><h3>Projects</h3>${db.projects.map(p=>`<div class="item"><div class="between"><div class="row"><span style="width:10px;height:10px;border-radius:50%;background:${esc(p.color||'#a5b4fc')}"></span><b>${esc(p.name)}</b></div><span class="chip">${db.sessions.filter(s=>s.projectId===p.id).length} sessions</span></div><div class="itemmeta">${fmtHM(db.sessions.filter(s=>s.projectId===p.id).reduce((a,s)=>a+duration(s),0))} tracked · ${db.tasks.filter(t=>t.projectId===p.id).length} tasks</div><div class="itemactions"><button data-action="editProject" data-id="${p.id}">Edit</button>${p.id!=='p-general'?`<button data-action="deleteProject" data-id="${p.id}" class="danger ghost">Delete</button>`:''}</div></div>`).join('')}</section><section class="panel"><h3>Tags</h3><p class="muted small">Use tags for cross-project concepts like Deep Work, Learning, Admin or Meetings.</p><div class="row wrap">${db.tags.map(t=>chip(t)).join(' ')||'No tags yet.'}</div><div class="itemactions">${btn('manageTags','＋ Add / remove tags')}</div></section>`}
function settingsPage(v){v.innerHTML=header('Backup, settings & sync','Your data stays on this device unless you choose to sync it.',btn('exportJSON','Export full backup','primary'))+`<section class="panel"><h3>Personal tracking settings</h3><form id="settingsForm" class="stack"><label>Daily tracked-time target (minutes)<input type="number" min="1" max="1440" name="dailyTargetMinutes" value="${Number(db.settings.dailyTargetMinutes)||240}"></label><label class="row" style="font-size:13px"><input type="checkbox" name="weekStartsMonday" style="width:17px" ${db.settings.weekStartsMonday!==false?'checked':''}> Week starts Monday</label><button class="primary">Save settings</button></form></section><section class="panel"><h3>Backup and restore</h3><div class="successbox">JSON backup includes tasks, sessions, projects, habits, check-in history, goals, notes and settings. Keep at least one copy outside this browser.</div><div class="formactions" style="margin-top:12px">${btn('exportJSON','⬇ Export JSON','primary')}${btn('exportCSV','Export time/task CSV')}${btn('importJSON','Import JSON backup')}</div><input id="importFile" type="file" accept=".json,application/json" hidden><div class="divider"></div><p class="muted small">Migration: ${db.migration?`Copied from ${esc(db.migration.from)} on ${esc(new Date(db.migration.at).toLocaleString())}. Legacy data was preserved.`:'No legacy migration marker found; this may be a new installation.'}</p></section><section class="panel"><h3>Phone ↔ computer sync (optional)</h3><div class="notice">Sync uses your own Supabase project. Until configured, LifeOS remains local and offline-first. Snapshot sync is manual: upload replaces cloud data; download replaces local data.</div><form id="syncConfig" class="stack" style="margin-top:12px"><label>Supabase project URL<input type="url" name="url" placeholder="https://your-project.supabase.co" value="${esc(localStorage.getItem('lifeos-supabase-url')||'')}"></label><label>Public anon / publishable key<input name="key" placeholder="Public client key" value="${esc(localStorage.getItem('lifeos-supabase-key')||'')}"></label><button class="primary">Save sync configuration</button></form><p class="muted small">Status: ${esc(syncStatus)}</p>${syncUser?`<div class="item">Signed in as <b>${esc(syncUser.email)}</b> ${btn('signOut','Sign out','ghost')}</div>`:`<form id="syncLogin" class="stack"><h3>Sign in or create account</h3><input type="email" name="email" placeholder="Email" required><input type="password" name="password" minlength="8" placeholder="Password (8+ characters)" required><div class="formactions"><button class="primary">Sign in</button>${btn('signUp','Create account')}</div></form>`}<div class="formactions" style="margin-top:10px">${btn('syncPush','Upload local snapshot', '',syncUser?'':'disabled')}${btn('syncPull','Download cloud snapshot','',syncUser?'':'disabled')}</div><p class="muted tiny">Before syncing, export a backup. Don't edit on two devices and upload blindly. This is not conflict-resolving, automatic background sync. Never paste a service-role key here.</p></section><section class="panel"><h3>Danger zone</h3><p class="muted small">Reset is irreversible unless you have a backup.</p>${btn('reset','Reset local LifeOS data','danger')}</section>`}

function modalHabit(h=null){openModal(h?'Edit habit':'Create habit',`<form id="modalHabit" class="stack"><label>Habit name *<input name="name" required value="${esc(h?.name||'')}" placeholder="e.g. Read 20 pages"></label><div class="grid2"><label>Category<input name="category" value="${esc(h?.category||'Health')}"></label><label>Frequency<select name="frequency">${['Daily','Weekdays','Weekly','Custom'].map(x=>`<option ${h?.frequency===x?'selected':''}>${x}</option>`).join('')}</select></label></div><label>Smallest successful version<input name="minimum" value="${esc(h?.minimum||'')} " placeholder="e.g. Read at least 2 pages"></label><div class="formactions"><button class="primary">Save habit</button><button type="button" data-action="closeModal">Cancel</button></div><input type="hidden" name="id" value="${esc(h?.id||'')}"></form>`)}

function timerStart(fd){if(db.running){toast('Stop the current timer before starting another.');return}db.running={id:uid(),description:String(fd.get('description')).trim(),projectId:String(fd.get('projectId')||'p-general'),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),taskId:String(fd.get('taskId')||''),goalId:String(fd.get('goalId')||''),start:Date.now(),day:today()};save();closeModal();render();toast('Timer started')}
function stopTimer(){if(!db.running)return;let r=db.running;db.sessions.push({...r,end:Date.now(),day:r.day||dateKey(new Date(r.start))});db.running=null;save();render();toast('Time entry saved')}
function download(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportJSON(){download('lifeos-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json')}
function exportCSV(){let rows=[['type','date','title','project','start','end','duration_minutes','tags_or_details']];db.tasks.forEach(t=>rows.push(['task',t.due||'',t.title,projectName(t.projectId),'','','',`done=${t.done}; priority=${t.priority}; category=${t.category}; notes=${t.notes||''}`]));db.sessions.forEach(s=>rows.push(['time',s.day,s.description,projectName(s.projectId),new Date(s.start).toISOString(),s.end?new Date(s.end).toISOString():'',Math.round(duration(s)/60000),(s.tags||[]).join('|')]));db.notes.forEach(n=>rows.push(['note',new Date(n.created).toISOString(),n.title,'','','','',(n.tags||[]).join('|')+' '+n.body]));(db.finance?.transactions||[]).forEach(t=>rows.push(['finance-'+t.type,t.date,t.description,(db.finance.accounts||[]).find(a=>a.id===t.accountId)?.name||'', '', '',t.amount,(t.category||'')+'; notes='+(t.notes||'')]));download('lifeos-export-'+today()+'.csv',rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function validateBackup(d){return d&&Array.isArray(d.tasks)&&Array.isArray(d.sessions)&&Array.isArray(d.habits)&&Array.isArray(d.notes)&&Array.isArray(d.goals)}
async function setupSync(url,key){if(!url||!key){syncClient=null;syncStatus='Local only';return}if(!window.supabase?.createClient){syncStatus='Sync library unavailable';return}syncClient=window.supabase.createClient(url,key);syncStatus='Configured — sign in'}
async function refreshAuth(){if(!syncClient)return;let {data,error}=await syncClient.auth.getUser();syncUser=data?.user||null;syncStatus=syncUser?'Signed in: '+syncUser.email:'Configured — not signed in'}
async function pushSync(){if(!syncClient||!syncUser)return toast('Configure sync and sign in first.');if(!confirm('Upload this entire local dataset and replace the cloud snapshot? Export a backup first.'))return;let {error}=await syncClient.from('lifeos_snapshots').upsert({user_id:syncUser.id,payload:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)alert('Upload failed: '+error.message);else{syncStatus='Cloud snapshot uploaded';render();toast('Cloud snapshot uploaded')}}
async function pullSync(){if(!syncClient||!syncUser)return toast('Configure sync and sign in first.');if(!confirm('Replace all local LifeOS data with the cloud snapshot? Export a backup first.'))return;let {data,error}=await syncClient.from('lifeos_snapshots').select('payload').eq('user_id',syncUser.id).maybeSingle();if(error)return alert('Download failed: '+error.message);if(!data)return toast('No cloud snapshot found yet.');if(!validateBackup(data.payload))return alert('Cloud snapshot format invalid.');db=normalize(data.payload);save();syncStatus='Cloud snapshot downloaded';render();toast('Downloaded')}
function byId(list,id){return list.find(x=>x.id===id)}
async function action(el){let a=el.dataset.action,id=el.dataset.id;
 if(el.dataset.page){page=el.dataset.page;render();return}
 if(a==='closeModal'||a==='modalBackdrop'){closeModal();return}

 if(a==='quickTask')modalTask();if(a==='quickNote')modalNote();if(a==='addNote')modalNote();if(a==='addGoal')modalGoal();if(a==='addHabit')modalHabit();if(a==='manualEntry')modalManual();if(a==='addProject')modalProject();

 if(a==='editRunning'&&db.running){let r=db.running;openModal('Edit running session details',`<form id="editRunningForm" class="stack"><label>Description<input name="description" required value="${esc(r.description)}"></label><label>Project<select name="projectId">${db.projects.map(p=>`<option value="${p.id}" ${p.id===r.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Tags<input name="tags" value="${esc((r.tags||[]).join(', '))}"></label><button class="primary">Save details</button></form>`)}
 if(a==='toggleTask'){let t=byId(db.tasks,id);if(t){t.done=el.checked;t.completedAt=t.done?new Date().toISOString():null;save();render()}}
 if(a==='taskTimer'){let t=byId(db.tasks,id);if(t){if(db.running&&!confirm('Stop the current timer and switch to this task?'))return;if(db.running)stopTimer();timerStart(new Map([['description',t.title],['projectId',t.projectId||'p-general'],['tags',''],['taskId',t.id],['goalId',t.goalId||'']]))}}
 if(a==='editTask')modalTask(byId(db.tasks,id));if(a==='deleteTask'&&confirm('Delete this task? Existing time sessions will be kept.')){db.tasks=db.tasks.filter(t=>t.id!==id);save();render()}
 if(a==='toggleHabit'){let h=byId(db.habits,id);if(!h)return;let arr=db.habitLog[today()]||(db.habitLog[today()]=[]);if(arr.includes(id))db.habitLog[today()]=arr.filter(x=>x!==id);else arr.push(id);save();render()}
 if(a==='editHabit')modalHabit(byId(db.habits,id));if(a==='deleteHabit'&&confirm('Delete this habit and its check-in history?')){db.habits=db.habits.filter(h=>h.id!==id);Object.keys(db.habitLog).forEach(d=>db.habitLog[d]=db.habitLog[d].filter(x=>x!==id));save();render()}
 if(a==='editNote')modalNote(byId(db.notes,id));if(a==='deleteNote'&&confirm('Delete this note?')){db.notes=db.notes.filter(n=>n.id!==id);save();render()}
 if(a==='addGoal')modalGoal();if(a==='editGoal')modalGoal(byId(db.goals,id));
 if(a==='updateGoal'){let g=byId(db.goals,id);if(g){let n=Number(prompt('Add progress amount', '1'));if(Number.isFinite(n)){g.current=(Number(g.current)||0)+n;if(g.current>=g.target)g.status='done';g.history=[...(g.history||[]),{at:new Date().toISOString(),delta:n}];save();render()}}}
 if(a==='goalTask'){let g=byId(db.goals,id);if(g){modalTask();let root=$('#modalRoot');root.dataset.goalId=g.id}}
 if(a==='deleteGoal'&&confirm('Delete this goal? Linked tasks and time entries remain.')){db.goals=db.goals.filter(g=>g.id!==id);save();render()}
 if(a==='editSession'){let s=byId(db.sessions,id);if(s)openModal('Edit time entry',`<form id="editSessionForm" class="stack"><label>Description<input name="description" value="${esc(s.description)}" required></label><div class="grid2"><label>Date<input type="date" name="day" value="${esc(s.day)}" required></label><label>Duration minutes<input type="number" min="1" name="minutes" value="${Math.max(1,Math.round(duration(s)/60000))}" required></label></div><label>Project<select name="projectId">${db.projects.map(p=>`<option value="${p.id}" ${p.id===s.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Tags<input name="tags" value="${esc((s.tags||[]).join(', '))}"></label><div class="formactions"><button class="primary">Save changes</button><button type="button" data-action="closeModal">Cancel</button></div><input type="hidden" name="id" value="${s.id}"></form>`)}
 if(a==='duplicateSession'){let s=byId(db.sessions,id);if(s){db.sessions.push({...s,id:uid(),start:Date.now(),end:Date.now()+duration(s),day:today(),manual:true});save();render();toast('Session duplicated for today; edit if needed')}}

 if(a==='editAccount'){let x=byId(db.finance.accounts,id);if(x){let name=prompt('Account name',x.name);if(name===null)return;let bal=prompt('Opening balance (₹)',String(x.openingBalance||0));if(bal===null)return;let last4=prompt('Last four digits (optional)',x.last4||'');x.name=name.trim()||x.name;x.openingBalance=Number(bal)||0;x.last4=String(last4||'').slice(0,4);save();render()}}
 if(a==='deleteAccount'){let x=byId(db.finance.accounts,id);if(x&&confirm('Delete this account? Transactions will remain in history but will no longer affect account balances.')){db.finance.accounts=db.finance.accounts.filter(a=>a.id!==id);save();render()}}
 if(a==='deleteTransaction'&&confirm('Delete this transaction?')){db.finance.transactions=db.finance.transactions.filter(t=>t.id!==id);save();render()}
 if(a==='editTransaction'){let t=byId(db.finance.transactions,id);if(t){let description=prompt('Description',t.description);if(description===null)return;let amount=prompt('Amount (₹)',String(t.amount));if(amount===null)return;let date=prompt('Date (YYYY-MM-DD)',t.date);if(date===null)return;t.description=description.trim()||t.description;t.amount=Math.max(0,Number(amount)||0);t.date=date;save();render()}}
 if(a==='deleteBudget'){let c=el.dataset.category;if(c&&confirm('Remove budget for '+c+'?')){delete db.finance.budgets[c];save();render()}}

 if(a==='reset'&&confirm('This deletes all local LifeOS data. Have you exported a backup?')){if(confirm('Final confirmation: permanently reset this browser’s LifeOS data?')){db=fresh();save();render();toast('Local data reset')}}
}
document.addEventListener('click',async e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}let act=e.target.closest('[data-action]');if(act){if(act.dataset.action==='modalBackdrop'&&e.target!==act)return;await action(act);return}let fil=e.target.closest('[data-filter]');if(fil){taskFilter=fil.dataset.filter;render();return}let day=e.target.closest('[data-day]');if(day){selectedDay=day.dataset.day;render()}});
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,fd=new FormData(f);
 if(f.id==='quickStart'||f.id==='startForm'){timerStart(fd)}
 if(f.id==='quickTaskForm'||f.id==='taskForm'||f.id==='modalTask'){let task={id:fd.get('id')||uid(),title:String(fd.get('title')||'').trim(),due:String(fd.get('due')||''),priority:String(fd.get('priority')||'normal'),category:String(fd.get('category')||''),projectId:String(fd.get('projectId')||''),notes:String(fd.get('notes')||''),done:false,created:Date.now(),goalId:$('#modalRoot').dataset.goalId||''};if(!task.title)return;let old=byId(db.tasks,task.id);if(old){Object.assign(old,task,{done:old.done,completedAt:old.completedAt})}else db.tasks.push(task);save();closeModal();render();toast(old?'Task updated':'Task added')}
 if(f.id==='modalNote'||f.id==='addNote'){let n={id:fd.get('id')||uid(),title:String(fd.get('title')||'').trim(),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),body:String(fd.get('body')||'').trim(),created:Date.now(),updated:Date.now()};let old=byId(db.notes,n.id);if(old)Object.assign(old,n,{created:old.created});else db.notes.push(n);save();closeModal();render();toast('Note saved')}
 if(f.id==='modalGoal'){let g={id:fd.get('id')||uid(),title:String(fd.get('title')).trim(),category:String(fd.get('category')||'Personal'),deadline:String(fd.get('deadline')||''),current:Number(fd.get('current')||0),target:Number(fd.get('target')||1),unit:String(fd.get('unit')||'units'),status:String(fd.get('status')||'active'),why:String(fd.get('why')||'')};let old=byId(db.goals,g.id);if(old)Object.assign(old,g);else db.goals.push(g);save();closeModal();render();toast('Goal saved')}
 if(f.id==='modalHabit'){let h={id:fd.get('id')||uid(),name:String(fd.get('name')).trim(),category:String(fd.get('category')||'General'),frequency:String(fd.get('frequency')||'Daily'),minimum:String(fd.get('minimum')||'').trim(),active:true};let old=byId(db.habits,h.id);if(old)Object.assign(old,h,{active:old.active});else db.habits.push(h);save();closeModal();render();toast('Habit saved')}
 if(f.id==='manualForm'){let day=String(fd.get('day')),m=Number(fd.get('minutes')),time=String(fd.get('time')||'12:00'),[hh,mm]=time.split(':').map(Number),start=new Date(day+'T00:00:00').getTime()+(hh*60+mm)*60000;db.sessions.push({id:uid(),description:String(fd.get('description')).trim(),projectId:String(fd.get('projectId')||'p-general'),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),goalId:String(fd.get('goalId')||''),start,end:start+m*60000,day,manual:true});save();closeModal();render();toast('Manual time entry saved')}
 if(f.id==='editSessionForm'){let s=byId(db.sessions,String(fd.get('id'))),day=String(fd.get('day')),m=Number(fd.get('minutes'));if(s){s.description=String(fd.get('description')).trim();s.day=day;s.start=new Date(day+'T12:00:00').getTime()-m*30000;s.end=s.start+m*60000;s.projectId=String(fd.get('projectId'));s.tags=String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean);save();closeModal();render();toast('Time entry updated')}}
 if(f.id==='modalProject'){let p={id:fd.get('id')||uid(),name:String(fd.get('name')).trim(),color:String(fd.get('color')||'#a5b4fc')};let old=byId(db.projects,p.id);if(old)Object.assign(old,p);else db.projects.push(p);save();closeModal();render()}

 if(f.id==='accountForm'){if(!db.finance)db.finance={accounts:[],transactions:[],budgets:{}};let name=String(fd.get('name')).trim();if(!name)return;db.finance.accounts.push({id:uid(),name,kind:String(fd.get('kind')||'Bank account'),openingBalance:Number(fd.get('openingBalance')||0),last4:String(fd.get('last4')||'').slice(0,4),created:Date.now()});save();render();toast('Account added')}
 if(f.id==='transactionForm'){let type=String(fd.get('type')),amount=Number(fd.get('amount'));if(!(amount>0))return alert('Enter an amount greater than zero.');let accountId=String(fd.get('accountId')),toAccountId=String(fd.get('toAccountId')||'');if(type==='transfer'&&(!toAccountId||toAccountId===accountId))return alert('Choose a different destination account.');db.finance.transactions.push({id:uid(),type,amount,description:String(fd.get('description')).trim(),date:String(fd.get('date')),category:type==='transfer'?'Account transfer':String(fd.get('category')||'Other'),accountId,toAccountId:type==='transfer'?toAccountId:'',notes:String(fd.get('notes')||''),created:Date.now()});save();render();toast('Transaction saved')}
 if(f.id==='budgetForm'){let c=String(fd.get('category')),n=Number(fd.get('amount'));if(n<0)return;db.finance.budgets=db.finance.budgets||{};db.finance.budgets[c]=n;save();render();toast('Budget saved')}

 if(f.id==='settingsForm'){db.settings.dailyTargetMinutes=Math.max(1,Math.min(1440,Number(fd.get('dailyTargetMinutes'))||240));db.settings.weekStartsMonday=fd.get('weekStartsMonday')==='on';save();render();toast('Settings saved')}
 if(f.id==='syncConfig'){localStorage.setItem('lifeos-supabase-url',String(fd.get('url')).trim());localStorage.setItem('lifeos-supabase-key',String(fd.get('key')).trim());await setupSync(String(fd.get('url')).trim(),String(fd.get('key')).trim());await refreshAuth();render();toast('Sync configuration saved on this device')}
 if(f.id==='syncLogin'){if(!syncClient)return toast('Save sync config first.');let {error}=await syncClient.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error)alert(error.message);else{await refreshAuth();render();toast('Signed in')}}
 if(f.id==='globalSearchForm'){let q=String(fd.get('q')).toLowerCase(),results=[];db.tasks.filter(x=>(x.title+' '+x.notes).toLowerCase().includes(q)).forEach(x=>results.push({type:'Task',title:x.title,page:'tasks',id:x.id}));db.notes.filter(x=>(x.title+' '+x.body+' '+x.tags.join(' ')).toLowerCase().includes(q)).forEach(x=>results.push({type:'Note',title:x.title||'Untitled note',page:'notes',id:x.id}));db.sessions.filter(x=>(x.description+' '+projectName(x.projectId)+' '+x.tags.join(' ')).toLowerCase().includes(q)).forEach(x=>results.push({type:'Time',title:x.description,page:'time',id:x.id}));db.habits.filter(x=>x.name.toLowerCase().includes(q)).forEach(x=>results.push({type:'Habit',title:x.name,page:'habits',id:x.id}));db.goals.filter(x=>x.title.toLowerCase().includes(q)).forEach(x=>results.push({type:'Goal',title:x.title,page:'goals',id:x.id}));$('#searchResults').innerHTML=results.map(x=>`<div class="item"><span class="chip">${x.type}</span> <b>${esc(x.title)}</b></div>`).join('')||empty('⌕','No matches found.');}
});
document.addEventListener('input',e=>{if(e.target.id==='noteSearch'){noteSearch=e.target.value;let pos=e.target.selectionStart;notesPage($('#main'));let n=$('#noteSearch');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='sessionFrom'||e.target.id==='sessionTo'){let from=$('#sessionFrom')?.value,to=$('#sessionTo')?.value;let list=db.sessions.filter(s=>(!from||s.day>=from)&&(!to||s.day<=to)).sort((a,b)=>b.start-a.start);$('#sessionList').innerHTML=sessionRows(list)}});
document.addEventListener('change',e=>{if(e.target.id==='txType'){let type=e.target.value,cat=$('#txCategory'),wrap=$('#toAccountWrap');if(cat){cat.innerHTML=(FIN_CATS[type]||FIN_CATS.expense).map(c=>`<option>${esc(c)}</option>`).join('');cat.disabled=type==='transfer'}if(wrap)wrap.classList.toggle('hide',type!=='transfer')}if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!validateBackup(x))throw Error('This file does not look like a LifeOS backup.');if(confirm('Replace local LifeOS data with this backup? Export current data first.')){db=normalize(x);save();render();toast('Backup restored')}}catch(err){alert('Import failed: '+err.message)}e.target.value=''};reader.readAsText(e.target.files[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();action({dataset:{action:'globalSearch'}})}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportJSON()}});
async function init(){let u=localStorage.getItem('lifeos-supabase-url'),k=localStorage.getItem('lifeos-supabase-key');if(u&&k){await setupSync(u,k);await refreshAuth()}if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render()}
setInterval(()=>{if(db.running&&$('#liveTimer'))$('#liveTimer').textContent=fmtMs(Date.now()-db.running.start);$('#clock').innerHTML=`${esc(new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))}<br><b style="color:var(--text)">${esc(new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}))}</b>`},1000);
init();
})();
</script></body></html>
