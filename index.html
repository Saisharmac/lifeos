&Number(a.targetMinutes)>0?' / '+fmtHM(Number(a.targetMinutes)*60000):''}</span></button>`}).join('')||empty('◉','Pin your favourite activities to start tracking in one tap.')}</div></section><section class="panel"><div class="between"><h3>Today's targets</h3>${btn('manageActivities','Manage','ghost')}</div>${acts.filter(a=>a.targetMode!=='none'&&Number(a.targetMinutes)>0).map(a=>{let m=activityMinutes(a),t=Number(a.targetMinutes),st=activityState(a),pct=Math.min(100,m/t*100),isMin=a.targetMode==='min',status=isMin?(m>=t?'Target achieved':`${fmtHM((t-m)*60000)} to go`):(m>t?`${fmtHM((m-t)*60000)} over limit`:`${fmtHM((t-m)*60000)} remaining`),color=st==='target-met'?'var(--good)':st==='target-over'?'var(--warn)':'var(--bad)';return `<div class="item"><div class="between"><div class="row"><span style="font-size:21px">${esc(a.icon||'◉')}</span><div><b>${esc(a.name)}</b><div class="itemmeta">${esc(a.category||'Uncategorised')} · ${isMin?'minimum target':'maximum limit'}</div></div></div><b style="color:${color}">${fmtHM(m*60000)} / ${fmtHM(t*60000)}</b></div><div class="activity-progress"><span style="width:${pct}%;background:${color}"></span></div><div class="between tiny" style="margin-top:6px"><span style="color:${color}">${status}</span><span class="muted">${Math.round(m/t*100)}%</span></div></div>`}).join('')||empty('◎','Set a minimum or maximum daily target for any activity.')}</section><section class="panel"><div class="between"><h3>All activities</h3>${btn('addActivity','＋ Add activity','primary')}</div><p class="muted tiny">Create activities such as UPSC → Reasoning, Sleep, Office, Commute, or Idle. Pin up to eight to the quick-start grid.</p>${acts.map(a=>`<div class="item"><div class="between"><div class="row"><span style="font-size:23px;width:32px;text-align:center">${esc(a.icon||'◉')}</span><div><b>${esc(a.name)}</b><div class="itemmeta">${esc(a.category||'General')} · ${(a.tags||[]).map(esc).join(', ')||'No labels'} · ${a.targetMode==='min'?'Minimum '+fmt function activityForm(a=null){let edit=a||{},mins=Math.max(0,Math.min(1440,Number(edit.targetMinutes)||0)),hours=Math.floor(mins/60),remainder=mins%60;openModal(a?'Edit activity':'New activity',`<form id="activityForm" class="stack" novalidate><label>Activity name *<input name="name" required maxlength="50" placeholder="e.g. UPSC — Reasoning" value="${esc(edit.name||'')}"></label><div class="grid2"><label>Icon (emoji or symbol)<input name="icon" maxlength="8" value="${esc(edit.icon||'◉')}" placeholder="📚"></label><label>Color<input name="color" type="color" value="${esc(edit.color||'#a78bfa')}" style="height:42px;padding:4px"></label></div><div class="grid2"><label>Category / parent<input name="category" value="${esc(edit.category||'General')}" placeholder="UPSC, Health, Work"></label><label>Labels / tags<input name="tags" value="${esc((edit.tags||[]).join(', '))}" placeholder="Study, Focus"></label></div><label>Daily target behavior<select name="targetMode"><option value="none" ${(!edit.targetMode||edit.targetMode==='none')?'selected':''}>No target</option><option value="min" ${edit.targetMode==='min'?'selected':''}>At least this much (e.g. study)</option><option value="max" ${edit.targetMode==='max'?'selected':''}>Keep below this limit (e.g. idle / sleep)</option></select></label><div class="grid2"><label>Target hours<input name="targetHours" type="number" inputmode="numeric" min="0" max="24" step="1" value="${hours}" placeholder="8"></label><label>Extra minutes<input name="targetRemainder" type="number" inputmode="numeric" min="0" max="59" step="1" value="${remainder}" placeholder="0"></label></div><p class="muted tiny" style="margin-top:-7px">Example: Sleep 8 hours = 8 hours + 0 minutes. Daily maximum is 24 hours. Changes are saved only when you tap Save activity.</p><label class="row"><input name="pinned" type="checkbox" style="width:18px" ${edit.pinned?'checked':''}> Pin to one of the 8 quick-start slots</label><div class="formactions"><button type="submit" class="primary">Save activity</button><button type="button" data-action="closeModal">Cancel</button></div><input type="hidden" name="id" value="${esc(edit.id||'')}"></form>`);const form=$('#activityForm');if(form){form.addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();void saveActivityForm()});const nameField=form.elements.namedItem('name');nameField?.focus()}}
function timePage(v){let r=db.running,sessions=[...db.sessions].sort((a,b)=>b.start-a.start),totals={};db.sessions.filter(s=>s.day===today()).forEach(s=>totals[s.projectId||'p-general']=(totals[s.projectId||'p-general']||0)+duration(s));v.innerHTML=header('Time tracker','Track the work, not just the clock.',btn('manualEntry','＋ Manual entry')+btn('exportCSV','Export CSV'))+`<section class="timerpanel ${r?'running':''}">${r?`<div class="between"><div><span class="timerpulse"></span><span class="eyebrow" style="color:var(--accent2)">CURRENT SESSION</span><h3 style="font-size:18px;margin:5px 0">${esc(r.description)}</h3><div class="itemmeta">${esc(projectName(r.projectId))} · ${(r.tags||[]).map(t=>chip(t)).join(' ')}</div></div>${chip('Live','good')}</div><div class="timerface" id="liveTimer">${fmtMs(Date.now()-r.start)}</div><div class="formactions">${btn('stopTimer','■ Stop & save','primary')}${btn('switchTimer','⇄ Switch activity')}${btn('editRunning','Edit details','ghost')}</div>`:`<div class="between"><div><div class="eyebrow">NEW SESSION</div><h3 style="font-size:19px;margin:5px 0 0">What are you working on?</h3><p class="muted small">Use a project and tags to make reports meaningful.</p></div>${chip('Ready')}</div>${startForm()}`}</section>

function calendarPage(v){let y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1);let offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);let days=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}let monthLabel=calendarMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});v.innerHTML=header('Calendar','A timeline of time sessions and deadlines.',btn('goTime','＋ Track time','primary'))+`<section class="panel"><div class="calendarhead"><button data-action="prevMonth">←</button><h3 style="margin:0">${monthLabel}</h3><button data-action="nextMonth">→</button></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="muted tiny" style="text-align:center;padding:5px">${x}</div>`).join('')}${days.map(d=>{let k=dateKey(d),isCurrent=d.getMonth()===m,has=daySessions(k).length,hasTask=db.tasks.some(t=>!t.done&&t.due===k);return `<button class="calday ${isCurrent?'':'other'} ${k===today()?'today':''} ${k===selectedDay?'selected':''}" data-day="${k}">${d.getDate()}<div class="dots">${has?'<i></i>'.repeat(Math.min(4,has)):''}${hasTask?'<i style="background:var(--warn)"></i>':''}</div></button>`}).join('')}</div><div class="divider"></div><div class="between"><h3 style="margin:0">${fmtDate(selectedDay)}</h3><span class="chip">${fmtHM(dayTotal(selectedDay))} tracked</span></div><div class="cols" style="margin-top:8px"><div><h3>Time sessions</h3>${sessionRows(daySessions(selectedDay).sort((a,b)=>a.start-b.start))}</div><div><h3>Tasks due</h3>${taskRows(db.tasks.filter(t=>t.due===selectedDay),30)}</div></div></section>`}

on>`}

function timerStart(fd){if(db.running){toast('Stop the current timer before starting another.');return}db.running={id:uid(),description:String(fd.get('description')).trim(),projectId:String(fd.get('projectId')||'p-general'),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),activityId:String(fd.get('activityId')||''),category:String(fd.get('category')||''),taskId:String(fd.get('taskId')||''),goalId:String(fd.get('goalId')||''),start:Date.now(),day:today()};save();closeModal();render();toast('Timer started')}

function validateBackup(d){if(!d||typeof d!=='object'||Array.isArray(d))return false;const required=['tasks','sessions','habits','notes','goals'];if(!required.every(k=>Array.isArray(d[k])))return false;if(d.tasks.length>100000||d.sessions.length>500000||d.habits.length>10000||d.notes.length>100000||d.goals.length>10000)return false;if(d.finance!==undefined&&(!d.finance||typeof d.finance!=='object'||!Array.isArray(d.finance.accounts||[])||!Array.isArray(d.finance.transactions||[])))return false;for(const k of required){if(d[k].some(x=>!x||typeof x!=='object'||Array.isArray(x)))return false}if(d.tasks.some(t=>t.title!==undefined&&typeof t.title!=='string'))return false;if(d.sessions.some(s=>s.start!==undefined&&!Number.isFinite(Number(s.start))))return false;return true}

 if(f.id==='globalSearchForm'){let q=String(fd.get('q')).toLowerCase(),results=[];db.tasks.filter(x=>(x.title+' '+x.notes).toLowerCase().includes(q)).forEach(x=>results.push({type:'Task',title:x.title,page:'tasks',id:x.id}));db.notes.filter(x=>(x.title+' '+x.body+' '+(Array.isArray(x.tags)?x.tags:[]).join(' ')).toLowerCase().includes(q)).forEach(x=>results.push({type:'Note',title:x.title||'Untitled note',page:'notes',id:x.id}));db.sessions.filter(x=>(x.description+' '+projectName(x.projectId)+' '+(Array.isArray(x.tags)?x.tags:[]).join(' ')).toLowerCase().includes(q)).forEach(x=>results.push({type:'Time',title:x.description,page:'time',id:x.id}));db.habits.filter(x=>x.name.toLowerCase().includes(q)).forEach(x=>results.push({type:'Habit',title:x.name,page:'habits',id:x.id}));db.goals.filter(x=>x.title.toLowerCase().includes(q)).forEach(x=>results.push({type:'Goal',title:x.title,page:'goals',id:x.id}));$('#searchResults').innerHTML=results.map(x=>`<button type="button" class="item search-result" style="width:100%;text-align:left" data-action="openSearchResult" data-type="${esc(x.type)}" data-id="${esc(x.id)}"><span class="chip">${esc(x.type)}</span> <b>${esc(x.title)}</b><span class="muted tiny" style="float:right">Open →</span></button>`).join('')||empty('⌕','No matches found.');}
});
document.addEventListener('input',e=>{if(e.target.id==='noteSearch'){noteSearch=e.target.value;let pos=e.target.selectionStart;notesPage($('#main'));let n=$('#noteSearch');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='sessionFrom'||e.target.id==='sessionTo'){let from=$('#sessionFrom')?.value,to=$('#sessionTo')?.value;let list=db.sessions.filter(s=>(!from||s.day>=from)&&(!to||s.day<=to)).sort((a,b)=>b.start-a.start);$('#sessionList').innerHTML=sessionRows(list)}});
document.addEventListener('change',e=>{if(e.target.id==='txType'){let type=e.target.value,cat=$('#txCategory'),wrap=$('#toAccountWrap');if(cat){cat.innerHTML=(FIN_CATS[type]||FIN_CATS.expense).map(c=>`<option>${esc(c)}</option>`).join('');cat.disabled=type==='transfer'}if(wrap)wrap.classList.toggle('hide',type!=='transfer')}if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!validateBackup(x))throw Error('This file does not look like a valid LifeOS backup. Required record collections are missing or malformed.');if(confirm('Replace local LifeOS data with this backup? Export current data first.')){db=normalize(x);save();render();toast('Backup restored')}}catch(err){alert('Import failed: '+err.message)}e.target.value=''};reader.readAsText(e.target.files[0])}});
window.addEventListener('error',e=>{console.error('Mr.Shadow runtime error',e.error||e.message);toast('Something went wrong. Your existing records have not intentionally been cleared.')});window.addEventListener('unhandledrejection',e=>{console.error('Mr.Shadow async error',e.reason);toast('A background save or action failed. Export a backup and check storage settings.')});window.addEventListener('online',()=>toast('Connection restored. Local records remain on this device.'));window.addEventListener('offline',()=>toast('Offline mode: local features remain available.'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();action({dataset:{action:'globalSearch'}})}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportJSON()}});
async function init(){const localSnapshot=normalize(db);try{const saved=await readIDB();const savedValid=saved&&validateBackup(saved);const localTime=Date.parse(localSnapshot.updatedAt||'')||0,idbTime=savedValid?(Date.parse(saved.updatedAt||'')||0):0;db=savedValid&&idbTime>localTime?normalize(saved):localSnapshot;if(!Array.isArray(db.activityPresets)||!db.activityPresets.length)db.activityPresets=DEFAULT_ACTIVITIES.map(x=>({...x}));await writeIDB(db);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('Could not refresh localStorage snapshot',e)}}catch(err){console.warn('IndexedDB unavailable; using localStorage fallback',err);db=localSnapshot;if(!Array.isArray(db.activityPresets)||!db.activityPresets.length)db.activityPresets=DEFAULT_ACTIVITIES.map(x=>({...x}));try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});render()}
setInterval(()=>{if(db.running&&$('#liveTimer'))$('#liveTimer').textContent=fmtMs(Date.now()-db.running.start);$('#clock').innerHTML=`${esc(new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))}<br><b style="color:var(--text)">${esc(new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}))}</b>`},1000);
init();
})();
